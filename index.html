<!-- ===== 3. CAPA DE DATOS (DataService) ===== -->
<script>
/* Los mensajes que vienen de la base de datos usan el nombre nuevo del rol */
function textoRol(t) { return String(t || '').replace(/jefe de ingenier[ií]a/gi, m => m[0] === 'J' ? 'Gerente de ingeniería' : 'gerente de ingeniería').replace(/\bel jefe\b/g, 'el gerente'); }
class ErrorApi extends Error {
  constructor(mensaje, { tipo = 'servidor', campos = null } = {}) { super(textoRol(mensaje)); this.tipo = tipo; this.campos = campos; }
}
const esperar = ms => new Promise(r => setTimeout(r, ms));
const claveUnica = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
function errorDe(error) {
  if (!error) return null;
  if (error instanceof ErrorApi) return error;
  const msg = String(error.message || '');
  if (['conflicto', 'validacion', 'permiso', 'no_encontrado'].includes(error.hint)) return new ErrorApi(msg, { tipo: error.hint });
  if (error.code === '23505') return new ErrorApi('Ya existe un registro con ese nombre.', { tipo: 'duplicado' });
  if (error.code === '23514') return new ErrorApi('Algún dato no tiene el formato correcto.', { tipo: 'validacion' });
  if (error.code === '42501') return new ErrorApi('Tu rol no tiene permiso para esta acción.', { tipo: 'permiso' });
  if (error.code === 'PGRST301' || /jwt/i.test(msg)) return new ErrorApi('Tu sesión expiró. Vuelve a iniciar sesión.', { tipo: 'sesion' });
  if (/fetch|network|load failed/i.test(msg)) return new ErrorApi('No se pudo conectar con el servidor. Revisa tu conexión a internet.', { tipo: 'conexion' });
  return new ErrorApi(msg || 'Ocurrió un error inesperado.');
}
/* ---------- Sesión continua ----------
   La llave de cada sesión dura 1 hora y se renueva sola. Si la computadora estuvo suspendida,
   el aplicativo minimizado mucho tiempo o el reloj de la computadora desfasado, puede salir vencida:
   en ese caso se pide una nueva y se reintenta, sin sacar a la persona del aplicativo. */
let renovandoSesion = null;
function renovarSesion() { // una sola renovación a la vez, aunque varias peticiones la pidan juntas
  if (!renovandoSesion) renovandoSesion = SB.auth.refreshSession()
    .then(r => !r.error && !!(r.data && r.data.session)).catch(() => false)
    .finally(() => setTimeout(() => { renovandoSesion = null; }, 0));
  return renovandoSesion;
}
async function sesionVigente() { // la sesión, con al menos 5 minutos de vida por delante
  let { data } = await SB.auth.getSession();
  let s = data.session; if (!s) return null;
  if (!s.expires_at || s.expires_at * 1000 - Date.now() < 5 * 60 * 1000) {
    if (await renovarSesion()) ({ data } = await SB.auth.getSession()), s = data.session || s;
  }
  return s;
}
/* Toda petición a la base de datos pasa por aquí: si regresa "llave vencida", se renueva y se repite con la llave nueva */
async function fetchConRenovacion(url, opciones = {}) {
  let r = await fetch(url, opciones);
  if (r.status === 401 && !/\/auth\/v1\//.test(String(url))) {
    let cuerpo = ''; try { cuerpo = await r.clone().text(); } catch (e) { /* sin cuerpo */ }
    if (/jwt|expired|PGRST301|token/i.test(cuerpo) && await renovarSesion()) {
      const { data } = await SB.auth.getSession();
      const encabezados = new Headers(opciones.headers || {});
      if (data.session) encabezados.set('Authorization', `Bearer ${data.session.access_token}`);
      r = await fetch(url, { ...opciones, headers: encabezados });
    }
  }
  return r;
}
async function ejecutar(consulta) {
  let r;
  try { r = await consulta; } catch (e) { throw errorDe(e); }
  const err = errorDe(r.error);
  if (err) { if (err.tipo === 'sesion') setTimeout(() => cerrarSesion(), 0); throw err; } // solo si ni renovando se pudo
  return r;
}
/* Supabase regresa máximo 1000 filas por consulta: se piden por páginas. */
async function leerTodo(fabrica) {
  const todo = [];
  for (let desde = 0; ; desde += 1000) {
    const { data } = await ejecutar(fabrica().range(desde, desde + 999));
    todo.push(...(data || []));
    if (!data || data.length < 1000) return todo;
  }
}
async function exigirFilas(consulta, mensaje = 'Tu rol no tiene permiso para esta acción.') {
  const { data } = await ejecutar(consulta);
  if (!data || !data.length) throw new ErrorApi(mensaje, { tipo: 'permiso' });
  return data;
}
function exigirPermiso(accion) { if (!estado.sesion || !puede(estado.sesion.rol_id, accion)) throw new ErrorApi('Tu rol no tiene permiso para esta acción.', { tipo: 'permiso' }); }
const porId = filas => Object.fromEntries(filas.map(f => [String(f.id), f]));
const listaCatalogo = obj => Object.values(obj || {}).map(v => ({ ...v, id: Number(v.id) }));
const vivosSkus = () => [...cache.skus.values()];
function entregablesActivos() { return listaCatalogo(cache.entregables).filter(e => e.activo).sort((a, b) => a.orden - b.orden); }
function nombreCorto(id) { return (id && cache.perfiles[id] && cache.perfiles[id].nombre) || 'Usuario'; }
function skuVivo(id) {
  const s = cache.skus.get(Number(id));
  if (!s) throw new ErrorApi('Ese SKU ya no existe. La lista ya se actualizó.', { tipo: 'no_encontrado' });
  return s;
}
function normalizarSku(f) {
  const casillas = {};
  for (const [k, v] of Object.entries(f.casillas || {})) casillas[k] = { completado: !!v.c, por: v.por || null, en: v.en || null };
  return { ...f, id: Number(f.id), familia_id: Number(f.familia_id), linea_id: f.linea_id != null ? Number(f.linea_id) : null, estatus_sku_id: Number(f.estatus_sku_id), casillas };
}
function avanceDeSku(sku, ents) {
  const na = cache.entregablesNA.get(Number(sku.id)) || new Set(); // casillas invalidadas por "No aplica"
  const casillas = ents.map(e => {
    const c = sku.casillas[String(e.id)];
    const noAplica = na.has(e.id);
    const hecho = !noAplica && !!(c && c.completado);
    return { entregable_id: e.id, nombre: e.nombre, completado: hecho, no_aplica: noAplica,
      completado_por: hecho ? c.por : null, completado_por_nombre: hecho ? nombreCorto(c.por) : null, completado_en: hecho ? c.en : null };
  });
  const cuentan = casillas.filter(c => !c.no_aplica);
  const completados = cuentan.filter(c => c.completado).length;
  return { casillas, completados, total: cuentan.length, porcentaje: calcularPorcentaje(completados, cuentan.length), estado_avance: estadoAvance(completados, cuentan.length) };
}

  const c = document.createElement('canvas');

  const ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', calidad);

/* ---------- Archivos de corte en Google Drive ---------- */
async function llamarDrive(accion, datos, reintento = true) {
  if (!driveListo()) throw new ErrorApi('Falta configurar el almacén de archivos. Avisa al gerente de ingeniería (revisar DRIVE_URL en index.html).', { tipo: 'configuracion' });
  const sesion = await sesionVigente();
  if (!sesion) throw new ErrorApi('Tu sesión expiró. Vuelve a iniciar sesión.', { tipo: 'sesion' });
  let r;
  try {
    r = await fetch(CONFIG.DRIVE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion, token: sesion.access_token, ...datos }) });
  } catch (e) { throw new ErrorApi('No se pudo conectar con el almacén de archivos. Revisa tu conexión a internet.', { tipo: 'conexion' }); }
  if (!r.ok) throw new ErrorApi('El almacén de archivos no respondió. Intenta de nuevo en unos minutos.', { tipo: 'conexion' });
  const res = await r.json();
  if (res.error && /sesi[oó]n expir/i.test(res.error)) { // la llave venció en el camino: se renueva y se reintenta una vez
    if (reintento && await renovarSesion()) return llamarDrive(accion, datos, false);
    throw new ErrorApi('Tu sesión expiró y no se pudo renovar. Presiona Salir y vuelve a entrar.', { tipo: 'sesion' });
  }
  if (res.error) throw new ErrorApi(res.error, { tipo: /permiso|vigente/i.test(res.error) ? 'permiso' : 'servidor' });
  return res;
}
const aBase64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); };

async function sha256Bytes(bytes) {
  const hash = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function sha256Archivo(archivo) {
  const hash = await crypto.subtle.digest('SHA-256', await archivo.arrayBuffer());
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function dataUrlABlob(dataUrl) {
  const [cab, datos] = dataUrl.split(',');
  const bin = atob(datos); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: cab.slice(5, cab.indexOf(';')) });
}

    const subida = await llamarDrive('subir', { contenido: aBase64(comprimido), nombre: archivo.name, nombre_drive: `${pieza} (subiendo).${extensionDe(archivo.name)}`, carpetas: carpetasDrive(sku.id, sku.clave, tipo.nombre), sku: sku.clave, pieza });
    const { data } = await ejecutar(SB.rpc('ing_registrar_version', {
      p_sku: sku.id, p_tipo: tipo.id, p_pieza: pieza, p_drive_id: subida.drive_id, p_nombre: archivo.name,
      p_tamano: archivo.size, p_tamano_guardado: subida.tamano_guardado || comprimido.length, p_sha256: sha,
      p_cambios: String(cambios || '').trim() || null
    })).catch(async e => { llamarDrive('borrar', { drive_ids: [subida.drive_id] }).catch(() => {}); throw e; });
    const fila = (data && data[0]) || {};
    if (fila.liberar_drive_id) llamarDrive('borrar', { drive_ids: [fila.liberar_drive_id] }).catch(() => {});
    // Ya con el número de versión, el archivo toma su nombre definitivo en Drive
    if (fila.version) llamarDrive('renombrar', { drive_id: subida.drive_id, nombre: nombreDrive(pieza, fila.version, archivo.name) }).catch(() => {});
    return fila.version;
  },
  async retirarDocumento(documentoId, motivo) {
    exigirPermiso('subir_documentos');
    if (String(motivo || '').trim().length < 10) throw new ErrorApi('Escribe el motivo del retiro (mínimo 10 caracteres).', { tipo: 'validacion' });
    const { data } = await ejecutar(SB.rpc('ing_retirar_documento', { p_documento: documentoId, p_motivo: String(motivo).trim() }));
    const ids = (data || []).map(x => x.liberar_drive_id).filter(Boolean);
    if (ids.length) llamarDrive('borrar', { drive_ids: ids }).catch(() => {});
  },

  async bytesDocumento(d, { registrar = true } = {}) {
    if (d.archivo_borrado || !d.drive_id) throw new ErrorApi('De esta versión solo queda el registro; su archivo ya se liberó para ahorrar espacio.', { tipo: 'no_encontrado' });

  async guardarCatalogoCorte(entidad, id, datos) {
    exigirPermiso('administrar');
    const tabla = { area: 'ing_areas_corte', tipo: 'ing_tipos_documento', maquina: 'ing_maquinas' }[entidad];
    const lista = listaCatalogo({ area: cache.areasCorte, tipo: cache.tiposDocumento, maquina: cache.maquinas }[entidad]);
    const errNombre = validarNombreCatalogo(datos.nombre ?? (lista.find(x => x.id === id) || {}).nombre, lista, id, entidad);
    if (datos.nombre !== undefined && errNombre) throw new ErrorApi(errNombre, { tipo: 'validacion', campos: { nombre: errNombre } });
    const cambio = { ...datos };
    if (cambio.nombre !== undefined) cambio.nombre = cambio.nombre.trim();
    if (cambio.extensiones !== undefined) {
      cambio.extensiones = String(cambio.extensiones).toLowerCase().replace(/[.\s]/g, '').replace(/,+/g, ',').replace(/^,|,$/g, '');
      if (!/^[a-z0-9]+(,[a-z0-9]+)*$/.test(cambio.extensiones)) throw new ErrorApi('Escribe los formatos separados por coma, por ejemplo: dxf o igs,iges', { tipo: 'validacion', campos: { extensiones: 'Escribe los formatos separados por coma, por ejemplo: dxf o igs,iges' } });
    }
    if (cambio.area_id !== undefined) cambio.area_id = Number(cambio.area_id);
    if (entidad === 'tipo' && !id && cambio.orden === undefined) cambio.orden = listaCatalogo(cache.tiposDocumento).reduce((m, t) => Math.max(m, t.orden || 0), 0) + 1;
    try {
      if (id) await exigirFilas(SB.from(tabla).update(cambio).eq('id', id).select('id'));
      else await ejecutar(SB.from(tabla).insert(cambio).select('id').single());
    } catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Ya existe uno con ese nombre.', { tipo: 'validacion', campos: { nombre: 'Ya existe uno con ese nombre.' } }); throw e; }
    await DataService.recargarCatalogosCorte();
  },
  /* ---------- Carga general ---------- */
  async recargarTodo() {
    const [fam, ent, est, per, skus] = await Promise.all([
      leerTodo(() => SB.from('ing_familias').select('id,nombre,activa').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_entregables').select('id,nombre,orden,activo').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_estatus_sku').select('id,nombre').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_perfiles').select('id,nombre,email,rol_id,activo').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_v_skus').select('*').order('id'))
    ]);
    cache.familias = porId(fam); cache.entregables = porId(ent); cache.estatus = porId(est);
    try { cache.lineas = porId(await leerTodo(() => SB.from('ing_lineas').select('id,nombre,activa').is('deleted_at', null).order('id'))); }
    catch (e) { cache.lineas = {}; } // la actualización de líneas aún no se ejecuta en Supabase
    await DataService.recargarCatalogosCorte();
    cache.perfiles = Object.fromEntries(per.map(p => [p.id, p]));
    try { // casillas que no aplican por SKU (los DXF o el IGES marcados como "No aplica")
      const na = await leerTodo(() => SB.from('ing_v_entregables_na').select('*').order('sku_id'));
      const m = new Map();
      for (const x of na) { const k = Number(x.sku_id); if (!m.has(k)) m.set(k, new Set()); m.get(k).add(Number(x.entregable_id)); }
      cache.entregablesNA = m;
    } catch (e) { cache.entregablesNA = new Map(); } // la actualización de "No aplica" aún no se ejecuta
    cache.skus = new Map(skus.map(f => { const s = normalizarSku(f); return [s.id, s]; }));
  },

  /* ---------- SKUs ---------- */
  async listarSkus(filtros = {}) {
    const ents = entregablesActivos();
    let lista = vivosSkus().map(s => skuConAvance(s, ents));
    if (!filtros.incluir_descontinuados) lista = lista.filter(s => !s.descontinuado);
    if (filtros.busqueda) { const q = normalizarTexto(filtros.busqueda); lista = lista.filter(s => normalizarTexto(`${s.clave} ${s.descripcion}`).includes(q)); }
    if (filtros.familia_id) lista = lista.filter(s => s.familia_id === Number(filtros.familia_id));
    if (filtros.linea_id) lista = lista.filter(s => s.linea_id === Number(filtros.linea_id));
    if (filtros.avance && filtros.avance !== 'todos') lista = lista.filter(s => s.estado_avance === filtros.avance);
    if (filtros.pendiente_entregable_id) { const id = Number(filtros.pendiente_entregable_id); lista = lista.filter(s => s.casillas.some(c => c.entregable_id === id && !c.completado && !c.no_aplica)); }
    lista.sort((a, b) => compararNatural(a.clave, b.clave));
    return { skus: lista, entregables: ents.map(e => ({ id: e.id, nombre: e.nombre })) };
  },
  async obtenerSku(id) {

  /* ---------- Tablero e historial ---------- */
  async obtenerTablero() {
    const ents = entregablesActivos();
    const activos = vivosSkus().filter(s => s.estatus_sku_id === ESTATUS_SKU.ACTIVO).map(s => skuConAvance(s, ents));
    const cuenta = est => activos.filter(s => s.estado_avance === est).length;
    const completos = cuenta('completo');
    const por_familia = listaCatalogo(cache.familias).map(f => {
      const de = activos.filter(s => s.familia_id === f.id);
      const listos = de.filter(s => s.estado_avance === 'completo').length;
      return { id: f.id, nombre: f.nombre, total: de.length, completos: listos, porcentaje: calcularPorcentaje(listos, de.length) };
    }).filter(f => f.total > 0).sort((a, b) => compararNatural(a.nombre, b.nombre));
    const por_linea = avancePorGrupo(activos, listaCatalogo(cache.lineas), 'linea_id');
    return {
      total: activos.length, completos, en_proceso: cuenta('en_proceso'), sin_iniciar: cuenta('sin_iniciar'),
      porcentaje_global: calcularPorcentaje(completos, activos.length),
      por_entregable: ents.map(e => {
        const aplica = activos.filter(s => !s.casillas.some(c => c.entregable_id === e.id && c.no_aplica));
        const listos = aplica.filter(s => s.casillas.some(c => c.entregable_id === e.id && c.completado)).length;
        return { id: e.id, nombre: e.nombre, completos: listos, total: aplica.length, porcentaje: calcularPorcentaje(listos, aplica.length) };
      }),
      por_familia, por_linea
    };
  },

  /* Reporte semanal o mensual: avance al día de hoy + actividad del periodo [desde, hasta). */
  async obtenerReporte({ desde, hasta, familia_id, linea_id }) {
    const ents = entregablesActivos();
    const enFiltro = s => (!familia_id || s.familia_id === Number(familia_id)) && (!linea_id || s.linea_id === Number(linea_id));
    const todos = vivosSkus().filter(enFiltro);
    const ids = new Set(todos.map(s => s.id));
    const activos = todos.filter(s => s.estatus_sku_id === ESTATUS_SKU.ACTIVO).map(s => skuConAvance(s, ents));
    const filas = await leerTodo(() => SB.from('ing_v_historial').select('*').gte('fecha', desde.toISOString()).lt('fecha', hasta.toISOString()).order('fecha').order('id'));
    const movs = filas.map(registroHistorial).filter(r => ids.has(r.sku_id));
    const enPeriodo = f => { const t = new Date(f).getTime(); return t >= desde.getTime() && t < hasta.getTime(); };
    const completadosPeriodo = activos.filter(s => s.estado_avance === 'completo').map(s => {
      const ultima = s.casillas.reduce((m, c) => (c.completado_en && (!m || c.completado_en > m) ? c.completado_en : m), null);
      return { ...s, completado_en: ultima };
    }).filter(s => s.completado_en && enPeriodo(s.completado_en)).sort((a, b) => compararNatural(a.clave, b.clave));
    const porUsuario = new Map();
    for (const r of movs) {
      const u = porUsuario.get(r.user_id) || { nombre: r.usuario_nombre, marcados: 0, desmarcados: 0, skus: new Set() };
      if (r.marcado) u.marcados++; else u.desmarcados++;
      u.skus.add(r.sku_id); porUsuario.set(r.user_id, u);
    }
    const cuenta = est => activos.filter(s => s.estado_avance === est).length;
    const completos = cuenta('completo');
    return {
      total: activos.length, completos, en_proceso: cuenta('en_proceso'), sin_iniciar: cuenta('sin_iniciar'),
      porcentaje_global: calcularPorcentaje(completos, activos.length),
      marcados: movs.filter(r => r.marcado).length, desmarcados: movs.filter(r => !r.marcado).length,
      completados_periodo: completadosPeriodo,
      por_entregable: ents.map(e => {
        const aplica = activos.filter(s => !s.casillas.some(c => c.entregable_id === e.id && c.no_aplica));
        const listos = aplica.filter(s => s.casillas.some(c => c.entregable_id === e.id && c.completado)).length;
        return { id: e.id, nombre: e.nombre, completos: listos, total: aplica.length, porcentaje: calcularPorcentaje(listos, aplica.length), marcados_periodo: movs.filter(r => r.marcado && r.entregable_id === e.id).length };
      }),
      por_familia: avancePorGrupo(activos, listaCatalogo(cache.familias), 'familia_id'),
      por_linea: avancePorGrupo(activos, listaCatalogo(cache.lineas), 'linea_id'),
      por_usuario: [...porUsuario.values()].map(u => ({ nombre: u.nombre, marcados: u.marcados, desmarcados: u.desmarcados, skus: u.skus.size })).sort((a, b) => b.marcados - a.marcados || compararNatural(a.nombre, b.nombre)),
      desmarcados_detalle: movs.filter(r => !r.marcado).sort((a, b) => a.fecha.localeCompare(b.fecha))
    };
  },
  async listarEntregables({ incluir_inactivos = false } = {}) {
    return listaCatalogo(cache.entregables).filter(e => incluir_inactivos || e.activo).sort((a, b) => a.orden - b.orden)
      .map(e => ({ id: e.id, nombre: e.nombre, orden: e.orden, activo: !!e.activo }));
  },
  async crearEntregable({ nombre }) {
    exigirPermiso('administrar');
    const err = validarNombreCatalogo(nombre, listaCatalogo(cache.entregables), null, 'entregable');
    if (err) throw new ErrorApi(err, { tipo: 'validacion', campos: { nombre: err } });
    const orden = listaCatalogo(cache.entregables).reduce((m, e) => Math.max(m, e.orden), 0) + 1;
    try { const { data } = await ejecutar(SB.from('ing_entregables').insert({ nombre: nombre.trim(), orden }).select('id,nombre,orden,activo').single()); programarRecarga(0); return data; }
    catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Ya existe un entregable con ese nombre.', { tipo: 'validacion', campos: { nombre: 'Ya existe un entregable con ese nombre.' } }); throw e; }
  },
  async actualizarEntregable(id, datos) {
    exigirPermiso('administrar');
    const cambio = {};
    if (datos.nombre !== undefined) {
      const err = validarNombreCatalogo(datos.nombre, listaCatalogo(cache.entregables), id, 'entregable');
      if (err) throw new ErrorApi(err, { tipo: 'validacion', campos: { nombre: err } });
      cambio.nombre = datos.nombre.trim();
    }
    if (datos.activo !== undefined) {
      if (!datos.activo && entregablesActivos().length <= 1) throw new ErrorApi('Debe quedar al menos un entregable activo.', { tipo: 'validacion' });
      cambio.activo = !!datos.activo;
    }
    try { const [e] = await exigirFilas(SB.from('ing_entregables').update(cambio).eq('id', id).select('id,nombre')); programarRecarga(0); return e; }
    catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Ya existe un entregable con ese nombre.', { tipo: 'validacion', campos: { nombre: 'Ya existe un entregable con ese nombre.' } }); throw e; }
  },
  async reordenarEntregable(id, direccion) {
    exigirPermiso('administrar');
    const lista = listaCatalogo(cache.entregables).sort((a, b) => a.orden - b.orden);
    const i = lista.findIndex(e => e.id === id), j = direccion === 'subir' ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= lista.length) throw new ErrorApi('Ese entregable ya está en el extremo.', { tipo: 'validacion' });
    await exigirFilas(SB.from('ing_entregables').update({ orden: lista[j].orden }).eq('id', lista[i].id).select('id'));
    await exigirFilas(SB.from('ing_entregables').update({ orden: lista[i].orden }).eq('id', lista[j].id).select('id'));
    programarRecarga(0);
  },
  async listarEstatusSku() { return listaCatalogo(cache.estatus).map(e => ({ id: e.id, nombre: e.nombre })); },

  /* ---------- Usuarios ---------- */
  async listarUsuarios() {
    exigirPermiso('administrar');
    const filas = await leerTodo(() => SB.from('ing_perfiles').select('*').is('deleted_at', null).order('created_at'));
    const orden = u => (!u.rol_id ? 0 : u.activo ? 1 : 2);
    return filas.map(u => ({ ...u, estado: !u.rol_id ? 'pendiente' : u.activo ? 'activo' : 'sin_acceso' }))
      .sort((a, b) => orden(a) - orden(b) || compararNatural(a.nombre, b.nombre));
  },
  async actualizarUsuario(id, cambio) {
    exigirPermiso('administrar');
    if (cambio.rol_id !== undefined && Number(cambio.rol_id) !== ROLES.OPERADOR) cambio = { ...cambio, maquina_id: null };
    const [u] = await exigirFilas(SB.from('ing_perfiles').update(cambio).eq('id', id).select('id,nombre,rol_id,activo'));
    programarRecarga(0);
    return u;
  }
};
</script>

<!-- ===== 4. ESTADO DE LA APLICACIÓN ===== -->
<script>
/* Única fuente de verdad de la interfaz. estado.sesion = { user_id, nombre, email, rol_id, rol_nombre }. */
const FILTROS_SKUS_INICIALES = { busqueda: '', familia_id: '', linea_id: '', avance: 'todos', pendiente_entregable_id: '', incluir_descontinuados: false };
const FILTROS_HISTORIAL_INICIALES = { busqueda: '', user_id: '', marcado: 'todos', entregable_id: '' };
const DETALLE_VACIO = { abierto: false, sku_id: null, cargando: false, error: null, datos: null, subiendoImagen: false, errorImagen: null, documentos: null, errorDocumentos: null, cobertura: null };
const AUTH_INICIAL = { pantalla: 'login', nombre: '', email: '', password: '', confirmar: '', error: null, mensaje: null, enviando: false, puedeReenviar: false };

function temaInicial() {
  try { const t = localStorage.getItem('ing-tema'); if (t === 'claro' || t === 'oscuro') return t; } catch (e) { /* sin almacenamiento */ }
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
}
const estado = {
  fase: 'iniciando', // iniciando | configuracion | auth | espera | app | error
  errorFatal: null,

  detalle: { ...DETALLE_VACIO },
  tablero: { cargando: false, error: null, datos: null },

  admin: { pestana: 'skus', cargando: false, error: null, skus: null, usuarios: null, familias: null, lineas: null, entregables: null, corte: null },
  pendientes: 0,
  confirmacion: null, // 'confirmada' cuando la persona llega desde el enlace del correo

  proto: { datos: null, conocidos: null, filtro: 'mios' },
  corte: { cargando: false, error: null, datos: null, filtros: { busqueda: '', tipo_id: '' }, descargas: null, verificacion: null, descargando: null, lote: null, espacio: null },
  modal: null,
  tema: temaInicial(),
  avisos: []
};
const temporizadores = {};
function conRetraso(clave, fn, ms = 200) { clearTimeout(temporizadores[clave]); temporizadores[clave] = setTimeout(fn, ms); }
function alternarTema() {
  estado.tema = estado.tema === 'oscuro' ? 'claro' : 'oscuro';
  try { localStorage.setItem('ing-tema', estado.tema); } catch (e) { /* solo en esta visita */ }
  render();
}
const urlApp = () => location.origin + location.pathname;

/* ---------- Arranque y sesión ---------- */
async function arrancar() {
  if (!configurado()) { estado.fase = 'configuracion'; render(); return; }
  if (!window.supabase || typeof window.supabase.createClient !== 'function') { estado.fase = 'error'; estado.errorFatal = 'No se pudo cargar la conexión con el servidor. Revisa tu conexión a internet y recarga la página.'; render(); return; }
  const enlace = leerEnlaceCorreo();
  const esRecuperacion = enlace.tipo === 'recovery';
  SB = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { autoRefreshToken: true, persistSession: true }, global: { fetch: (u, o) => fetchConRenovacion(u, o) } });
  const revisarSesion = () => { if (estado.sesion) sesionVigente().catch(() => {}); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarSesion(); });
  window.addEventListener('focus', revisarSesion);
  window.addEventListener('online', revisarSesion);
  setInterval(revisarSesion, 10 * 60 * 1000);
  SB.auth.onAuthStateChange(evento => {
    if (evento === 'PASSWORD_RECOVERY') setTimeout(() => { estado.fase = 'auth'; estado.auth = { ...AUTH_INICIAL, pantalla: 'nueva_password' }; render(); }, 0);
  });
  try {
    const { data } = await SB.auth.getSession();
    limpiarEnlaceCorreo();
    if (enlace.error) { estado.fase = 'auth'; estado.auth = { ...AUTH_INICIAL, error: mensajeEnlaceInvalido(enlace), puedeReenviar: enlace.esConfirmacion || !enlace.tipo }; render(); return; }
    if (esRecuperacion && data.session) { estado.fase = 'auth'; estado.auth = { ...AUTH_INICIAL, pantalla: 'nueva_password' }; render(); return; }
    if (enlace.esConfirmacion) estado.confirmacion = 'confirmada';
    if (data.session) await entrarConSesion(data.session.user);
    else { estado.fase = 'auth'; if (enlace.esConfirmacion) estado.auth = { ...AUTH_INICIAL, mensaje: '¡Tu correo quedó confirmado! Ya puedes iniciar sesión con tu correo y tu contraseña.' }; render(); }
  } catch (e) { estado.fase = 'error'; estado.errorFatal = errorDe(e).message; render(); }
}
/* Lo que Supabase agrega a la dirección al volver desde un correo (confirmación, recuperación o error). */
function leerEnlaceCorreo() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const query = new URLSearchParams(location.search);
  const valor = k => hash.get(k) || query.get(k);
  const tipo = valor('type');
  return { tipo, esConfirmacion: ['signup', 'email', 'email_change', 'invite'].includes(tipo), error: valor('error_description') || valor('error'), codigo: valor('error_code') };
}
function limpiarEnlaceCorreo() {
  if (/access_token|error|type=|code=/.test(location.hash + location.search)) history.replaceState(null, '', urlApp());
}
function mensajeEnlaceInvalido(enlace) {
  if (/expired|invalid/i.test(`${enlace.codigo} ${enlace.error}`)) return 'El enlace del correo ya expiró o ya se había usado. Si ya confirmaste tu correo, solo inicia sesión. Si no, escribe tu correo abajo y presiona "Reenviar correo de confirmación".';
  return 'No se pudo validar el enlace del correo. Intenta iniciar sesión; si tu correo aún no está confirmado, te enviaremos otro enlace.';
}
async function entrarConSesion(usuario) {
  estado.fase = 'iniciando'; render();
  try {
    const perfil = await DataService.obtenerMiPerfil(usuario.id);
    if (!perfil || !perfil.rol_id || !perfil.activo) {
      estado.fase = 'espera'; estado.espera = { motivo: perfil && perfil.rol_id && !perfil.activo ? 'sin_acceso' : 'pendiente', email: usuario.email, revisando: false };
      render(); return;
    }
    const primeraVez = !estado.sesion;
    estado.sesion = { user_id: perfil.id, nombre: perfil.nombre, email: perfil.email, rol_id: Number(perfil.rol_id), rol_nombre: NOMBRES_ROL[perfil.rol_id], maquina_id: perfil.maquina_id ? Number(perfil.maquina_id) : null, corte_revisado_en: perfil.corte_revisado_en || null };
    // primera vez: se toma este momento como punto de partida para los avisos
    if (Number(perfil.rol_id) === ROLES.OPERADOR && !perfil.corte_revisado_en && 'corte_revisado_en' in perfil) estado.sesion.corte_revisado_en = await DataService.marcarCorteRevisado();
    if (estado.sesion.rol_id === ROLES.OPERADOR) {
      await DataService.recargarCatalogosCorte();
      const maq = cache.maquinas[String(estado.sesion.maquina_id)];
      estado.sesion.maquina = maq ? { nombre: maq.nombre, area: (cache.areasCorte[String(maq.area_id)] || {}).nombre || '' } : null;
      estado.vista = 'corte';
    } else {
      await DataService.recargarTodo();
      await cargarCatalogos();
      await cargarObservacionesGlobal({ primera: true });
      await cargarSolicitudes({ primera: true });
      await cargarPrototipos({ primera: true });
      if (puede(estado.sesion.rol_id, 'subir_documentos') && driveListo() && !estado.proto.limpiado) {
        estado.proto.limpiado = true;
        DataService.limpiarPrototiposVencidos().then(n => { if (n) cargarPrototipos(); });
      }
      if (primeraVez || estado.vista === 'corte' && !puede(estado.sesion.rol_id, 'documentos')) estado.vista = [ROLES.INGENIERO, ROLES.CONSULTA].includes(estado.sesion.rol_id) ? 'skus' : 'tablero';
      if (estado.vista === 'tablero' && estado.sesion.rol_id === ROLES.CONSULTA) estado.vista = 'skus';
    }
    estado.fase = 'app';
    if (estado.confirmacion === 'confirmada') { estado.confirmacion = null; agregarAviso('exito', `¡Tu correo quedó confirmado! Bienvenido, ${estado.sesion.nombre}.`); }
    suscribirCambios();
    cargarVista();
  } catch (e) { estado.fase = 'error'; estado.errorFatal = e.message; render(); }
}
async function revisarAcceso() {
  estado.espera.revisando = true; render();
  const { data } = await SB.auth.getSession();
  if (data.session) await entrarConSesion(data.session.user); else { estado.fase = 'auth'; render(); }
}
async function cerrarSesion() {
  if (canal) { SB.removeChannel(canal); canal = null; }
  await DataService.cerrarSesion();
  actualizarTituloPestana(0);
  Object.assign(estado, {
    fase: 'auth', auth: { ...AUTH_INICIAL }, sesion: null, modal: null, detalle: { ...DETALLE_VACIO }, avisos: [], campanaAbierta: false,
    obs: { lista: null, filtro: 'abiertas', vistas: null },
    solicitudes: { lista: null, conocidas: null },
    proto: { datos: null, conocidos: null, filtro: 'mios' },
    skus: { cargando: false, error: null, datos: null, entregables: [], filtros: { ...FILTROS_SKUS_INICIALES }, celdaGuardando: null },
    tablero: { cargando: false, error: null, datos: null },
    historial: { cargando: false, error: null, datos: null, total: 0, usuarios: [], filtros: { ...FILTROS_HISTORIAL_INICIALES }, limite: 50, exportando: false },
    admin: { pestana: 'skus', cargando: false, error: null, skus: null, usuarios: null, familias: null, lineas: null, entregables: null, corte: null }
  });

/* ---------- Formularios de acceso ---------- */
function irAPantallaAuth(pantalla) { estado.auth = { ...AUTH_INICIAL, pantalla, email: estado.auth.email }; enfocarDespues = pantalla === 'registro' ? 'auth-nombre' : 'auth-email'; render(); }
async function enviarAuth() {
  const a = estado.auth;
  const email = a.email.trim().toLowerCase();
  const error = validarFormularioAuth(a.pantalla, { ...a, email });
  if (error) { a.error = error; a.mensaje = null; render(); return; }
  a.enviando = true; a.error = null; a.mensaje = null; render();
  try {
    if (a.pantalla === 'login') { const u = await DataService.iniciarSesion(email, a.password); await entrarConSesion(u); return; }
    if (a.pantalla === 'registro') {
      const r = await DataService.registrarse({ nombre: a.nombre.trim(), email, password: a.password });
      if (r.conSesion) { await entrarConSesion(r.usuario); return; }
      estado.auth = { ...AUTH_INICIAL, pantalla: 'login', email, mensaje: `Listo. Te enviamos un correo a ${email}: abre el enlace para confirmar tu cuenta y después inicia sesión. El gerente de ingeniería tendrá que aprobar tu acceso.` };
    }
    if (a.pantalla === 'recuperar') {
      await DataService.recuperarPassword(email);
      estado.auth = { ...AUTH_INICIAL, pantalla: 'login', email, mensaje: `Si existe una cuenta con ${email}, te llegará un correo con un enlace para crear una contraseña nueva. Revisa también la carpeta de spam.` };
    }
    if (a.pantalla === 'nueva_password') {
      const u = await DataService.cambiarPassword(a.password);
      agregarAviso('exito', 'Contraseña actualizada.');
      await entrarConSesion(u); return;

}
async function reenviarConfirmacion() {
  const a = estado.auth;
  const email = a.email.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { a.error = 'Escribe tu correo para reenviarte el enlace de confirmación.'; render(); return; }
  a.enviando = true; render();

  } catch (e) { a.error = e.message; }
  finally { estado.auth.enviando = false; render(); }

/* ---------- Tiempo real ---------- */
function suscribirCambios() {
  if (canal) SB.removeChannel(canal);
  canal = SB.channel('ing-cambios');
  for (const tabla of ['ing_sku_entregables', 'ing_skus', 'ing_familias', 'ing_lineas', 'ing_entregables', 'ing_perfiles', 'ing_documentos_corte', 'ing_versiones_documento', 'ing_maquinas', 'ing_tipos_documento', 'ing_areas_corte', 'ing_sku_tipo_na', 'ing_sku_tipo_piezas', 'ing_observaciones', 'ing_medidas', 'ing_solicitudes', 'ing_prototipos', 'ing_prototipo_archivos', 'ing_prototipo_cortes']) {
    canal.on('postgres_changes', { event: '*', schema: 'public', table: tabla }, () => programarRecarga());
  }
  canal.subscribe();
}
function programarRecarga(ms = 700) { conRetraso('recarga', recargarYRefrescar, ms); }
async function recargarYRefrescar() {
  if (estado.fase !== 'app') return;
  if (estado.sesion.rol_id === ROLES.OPERADOR) { await DataService.recargarCatalogosCorte(); cargarCorte({ silencioso: true }); return; }
  try { await DataService.recargarTodo(); } catch (e) { return; }
  cargarObservacionesGlobal(); cargarSolicitudes(); cargarPrototipos();
  const yo = cache.perfiles[estado.sesion.user_id];
  if (!yo || !yo.activo || !yo.rol_id) { const { data } = await SB.auth.getSession(); if (data.session) entrarConSesion(data.session.user); return; }
  if (Number(yo.rol_id) !== estado.sesion.rol_id) {
    estado.sesion.rol_id = Number(yo.rol_id); estado.sesion.rol_nombre = NOMBRES_ROL[yo.rol_id];
    agregarAviso('exito', `Tu rol cambió a ${estado.sesion.rol_nombre}.`);
  }
  await cargarCatalogos();
  refrescarVistas();
}
function refrescarVistas() {
  if (estado.vista === 'skus') cargarSkus({ silencioso: true });
  else if (estado.vista === 'tablero') cargarTablero({ silencioso: true });
  else if (estado.vista === 'historial') cargarHistorial({ silencioso: true });
  else if (estado.vista === 'corte') cargarCorte({ silencioso: true });
  else if (estado.vista === 'admin' && puede(estado.sesion.rol_id, 'administrar')) recargarAdminSilencioso();
  if (estado.detalle.abierto) refrescarDetalleSi(estado.detalle.sku_id);
}

/* ---------- Avisos ---------- */
let siguienteAviso = 1;
function agregarAviso(tipo, texto) {
  const id = siguienteAviso++;
  estado.avisos.push({ id, tipo, texto }); render();
  setTimeout(() => cerrarAviso(id), tipo === 'error' ? 7000 : 4000);
}
function cerrarAviso(id) { estado.avisos = estado.avisos.filter(a => a.id !== id); render(); }

/* ---------- Navegación ---------- */
function irA(vista) { estado.vista = vista; estado.detalle.abierto = false; estado.modal = null; window.scrollTo(0, 0); cargarVista(); }
function cargarVista() {
  if (estado.vista === 'skus') cargarSkus();
  else if (estado.vista === 'tablero') cargarTablero();
  else if (estado.vista === 'historial') cargarHistorial();
  else if (estado.vista === 'corte') cargarCorte();
  else if (estado.vista === 'observaciones') cargarObservacionesGlobal();
  else if (estado.vista === 'prototipos') cargarPrototipos();
  else if (estado.vista === 'admin') { if (puede(estado.sesion.rol_id, 'administrar')) cargarAdmin(); else render(); }
}
async function cargarCatalogos() {
  const [familias, lineas, entregables, estatus] = await Promise.all([
    DataService.listarFamilias({ incluir_inactivas: true }), DataService.listarLineas({ incluir_inactivas: true }), DataService.listarEntregables({ incluir_inactivos: true }), DataService.listarEstatusSku()
  ]);
  estado.catalogos = { familias, lineas, entregables, estatus };
  estado.pendientes = Object.values(cache.perfiles).filter(p => !p.rol_id).length;

/* ---------- Avance por SKU ---------- */
async function cargarSkus({ silencioso = false } = {}) {
  if (!silencioso) { estado.skus.cargando = true; estado.skus.error = null; render(); }
  try { const r = await DataService.listarSkus(estado.skus.filtros); estado.skus.datos = r.skus; estado.skus.entregables = r.entregables; estado.skus.error = null; }

}
function cambiarFiltroSkus(campo, valor) {
  estado.skus.filtros[campo] = valor; render();
  if (campo === 'busqueda') conRetraso('skus', () => cargarSkus({ silencioso: true })); else cargarSkus({ silencioso: true });
}
function limpiarFiltrosSkus() { estado.skus.filtros = { ...FILTROS_SKUS_INICIALES }; cargarSkus({ silencioso: true }); }
function verSkusFiltrados(parcial) { estado.skus.filtros = { ...FILTROS_SKUS_INICIALES, ...parcial }; irA('skus'); }
function reemplazarSkuEnLista(sku) {
  if (estado.skus.datos) estado.skus.datos = estado.skus.datos.map(s => s.id === sku.id ? sku : s);
  if (estado.admin.skus) estado.admin.skus = estado.admin.skus.map(s => s.id === sku.id ? sku : s);
}
/* Casillas que se marcan solas según los archivos de corte (las ligadas a un tipo de documento) */
function esCasillaAuto(entregableId) { return DataService.catalogosCorte().tipos.some(t => t.activo && Number(t.entregable_id) === Number(entregableId)); }
async function alternarCasilla(sku, casilla) {
  if (!puede(estado.sesion.rol_id, 'marcar') || estado.skus.celdaGuardando || casilla.no_aplica || esCasillaAuto(casilla.entregable_id)) return;
  if (casilla.completado) { abrirModalDesmarcar(sku, casilla); return; }
  estado.skus.celdaGuardando = `${sku.id}-${casilla.entregable_id}`; render();
  try {
    // NO IMPLEMENTADO: comentario opcional al marcar — la función ing_marcar lo acepta, pero se acordó marcar con un solo clic
    const actualizado = await DataService.marcarEntregable(sku.id, casilla.entregable_id);
    reemplazarSkuEnLista(actualizado);
    agregarAviso('exito', `Entregable marcado como correcto: ${casilla.nombre} en ${sku.clave}.`);
    refrescarDetalleSi(sku.id);
  } catch (e) {
    agregarAviso('error', `No se pudo marcar ${casilla.nombre} en ${sku.clave}. ${e.message}`);

async function confirmarDesmarcar() {

  m.enviando = true; m.error = null; render();
  try {
    const actualizado = await DataService.desmarcarEntregable(m.sku_id, m.entregable_id, m.causa);

  try {

    agregarAviso('exito', m.noAplica ? `${t.tipo_nombre}: marcado como "No aplica".` : n ? `${t.tipo_nombre}: ${n} ${n === 1 ? 'pieza esperada' : 'piezas esperadas'}.` : `${t.tipo_nombre}: guardado.`);

/* ---------- Exportar (respaldo en CSV para Excel) ---------- */
function descargarCsv(nombre, filas) {
  const celda = v => { let t = v === null || v === undefined ? '' : String(v); if (/^[=+\-@]/.test(t)) t = "'" + t; return /[",\n;]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const texto = '\uFEFF' + filas.map(f => f.map(celda).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const fechaArchivo = () => new Date().toISOString().slice(0, 10);
async function exportarAvance() {
  try {
    const r = await DataService.listarSkus({ incluir_descontinuados: true });
    const filas = [['SKU', 'Descripción', 'Familia', 'Línea', 'Estatus', ...r.entregables.map(e => e.nombre), 'Avance %']];
    for (const s of r.skus) filas.push([s.clave, s.descripcion, s.familia_nombre, s.linea_nombre, s.estatus_nombre, ...s.casillas.map(c => c.completado ? 'Sí' : 'No'), s.porcentaje]);
    descargarCsv(`avance-ingenieria-${fechaArchivo()}.csv`, filas);
    agregarAviso('exito', `Avance exportado: ${r.skus.length} SKUs.`);
  } catch (e) { agregarAviso('error', `No se pudo exportar: ${e.message}`); }
}

  try {

    descargarCsv(`historial-ingenieria-${fechaArchivo()}.csv`, filas);
    agregarAviso('exito', `Historial exportado: ${regs.length} movimientos.`);
  } catch (e) { agregarAviso('error', `No se pudo exportar: ${e.message}`); }

}

  const s = estado.sesion; if (!s) return;

      if (nuevos.length) notificar('Prototipo por cortar', nuevos.length === 1 ? `${nuevos[0].ingeniero_nombre || 'Ingeniería'} mandó a cortar ${nuevos[0].nombre}.` : `${nuevos.length} prototipos nuevos por cortar.`);
    }

      for (const c of d.cortes.filter(c => !antes.has(`c${c.id}`))) {
        const p = lista.find(x => x.id === c.prototipo_id);

}

async function cargarSolicitudes({ primera = false } = {}) {
  if (!estado.sesion) return;
  const lista = await DataService.listarSolicitudes();
  if (lista === null) { estado.solicitudes.lista = null; return; }
  const antes = estado.solicitudes.conocidas, ahora = new Map(lista.map(x => [x.id, x.estado]));
  if (!primera && antes) {
    if (puede(estado.sesion.rol_id, 'subir_documentos')) {
      const nuevas = lista.filter(x => x.estado === 'pendiente' && !antes.has(x.id));
      if (nuevas.length) notificar('Solicitud de archivo', nuevas.length === 1 ? `${nuevas[0].maquina_nombre || nuevas[0].solicitante_nombre} pide ${nuevas[0].tipo_nombre} de ${nuevas[0].sku_clave}: ${nuevas[0].detalle.slice(0, 80)}` : `${nuevas.length} solicitudes nuevas de archivos.`);
    }
    if (estado.sesion.rol_id === ROLES.OPERADOR) {
      const cambiadas = lista.filter(x => x.estado !== 'pendiente' && antes.get(x.id) === 'pendiente');
      for (const x of cambiadas) notificar(x.estado === 'atendida' ? 'Solicitud atendida' : 'Solicitud rechazada', `${x.sku_clave} · ${x.tipo_nombre}${x.respuesta ? `: ${x.respuesta.slice(0, 80)}` : ''}`);
    }
  }
  estado.solicitudes.conocidas = ahora; estado.solicitudes.lista = lista;
  render();
}

function buscarSkusSolicitud(q) {
  const m = estado.modal, t = String(q || '').trim();
  m.skuElegido = null;
  if (!t) { m.sugerencias = []; render(); return; }
  conRetraso('solsku', async () => {
    let res = [];
    if (cache.skus && cache.skus.size) {
      const n = normalizarTexto(t);
      res = [...cache.skus.values()].filter(s => normalizarTexto(`${s.clave} ${s.descripcion}`).includes(n))
        .sort((a, b) => (normalizarTexto(a.clave).startsWith(n) ? 0 : 1) - (normalizarTexto(b.clave).startsWith(n) ? 0 : 1) || compararNatural(a.clave, b.clave)).slice(0, 8);
    } else {
      try {
        const pat = `%${t.replace(/[%_,()*]/g, ' ').trim()}%`;
        const { data } = await ejecutar(SB.from('ing_skus').select('id,clave,descripcion,miniatura').is('deleted_at', null).or(`clave.ilike.${pat},descripcion.ilike.${pat}`).order('clave').limit(8));
        res = data || [];
      } catch (e) { res = []; }
    }
    if (estado.modal === m) { m.sugerencias = res; m.buscado = t; render(); }
  }, 200);
}

/* Descarga todas las piezas de un SKU, una por una, con aviso de avance. */
async function descargarTodasLasPiezas(skuClave, lista) {
  if (estado.corte.descargando || !lista.length) return;
  if (typeof JSZip === 'undefined') { agregarAviso('error', 'No se pudo preparar el ZIP: revisa tu conexión y recarga la página.'); return; }
  estado.corte.lote = { clave: skuClave, hecho: 0, total: lista.length, errores: 0 }; estado.corte.descargando = 'lote'; render();
  const zip = new JSZip();
  const usados = new Set();
  const cola = [...lista];
  const trabajador = async () => {
    while (cola.length) {
      const d = cola.shift();
      try {
        const bytes = await DataService.bytesDocumento(d);
        // Dentro del ZIP: una carpeta por tipo de archivo, con el nombre de la pieza y su versión
        let ruta = `${d.tipo_nombre}/${nombreDescargaDocumento(d)}`;
        for (let n = 2; usados.has(ruta.toLowerCase()); n++) ruta = ruta.replace(/(\.[^.]+)$/, `_${n}$1`);
        usados.add(ruta.toLowerCase());
        zip.file(ruta, bytes);
      } catch (e) { estado.corte.lote.errores++; }
      estado.corte.lote.hecho++; render();
    }
  };
  await Promise.all([trabajador(), trabajador(), trabajador()]); // 3 a la vez
  const l = estado.corte.lote;
  if (l.hecho > l.errores) {
    const contenido = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
    guardarArchivo(contenido, `${skuClave}_archivos-de-corte_${new Date().toISOString().slice(0, 10)}.zip`);
  }
  agregarAviso(l.errores ? 'error' : 'exito', l.errores ? `Se descargaron ${l.hecho - l.errores} de ${l.total} piezas de ${skuClave}; ${l.errores} fallaron.` : `Se descargaron las ${l.total} piezas de ${skuClave} en un archivo ZIP.`);
  estado.corte.lote = null; estado.corte.descargando = null; render();
}

    const renombrar = m.doc && pieza && normalizarTexto(pieza) !== normalizarTexto(m.doc.pieza);
    const choque = renombrar && previas.get(normalizarTexto(pieza));

  if (!m.archivos.length) { m.error = 'Elige al menos un archivo.'; render(); return; }
  if (plan.conError) { m.error = 'Revisa las piezas marcadas en rojo.'; render(); return; }
  const errCambios = validarCambiosDocumento(m.cambios, plan.versiones === 0);
  if (errCambios) { m.error = errCambios; render(); return; }
  m.fase = 'subiendo'; m.enviando = true; m.total = plan.filas.length; m.hecho = 0; m.errores = []; render();
  for (const f of plan.filas) {

    try {

      await DataService.subirDocumento({ sku: m.sku, tipo, pieza: f.pieza, archivo: f.archivo, cambios: m.cambios, esPrimera: f.esPrimera });
      await DataService.guardarNomenclatura(m.sku.id, tipo.id, f.pieza, f.datos, nomenDeTipo(tipo).atributo);

function claveDeArchivo(nombre) { return normalizarClave(nombre.replace(/\.[^.]+$/, '')); }
function planImportacion(m) {
  const porClave = new Map((estado.admin.skus || []).map(s => [s.clave, s]));
  const coinciden = [], sinSku = [], yaTienen = [], invalidos = [];
  for (const f of m.archivos) {
    const sku = porClave.get(claveDeArchivo(f.name));
    if (!sku) { sinSku.push(f.name); continue; }
    if (validarImagen({ type: f.type, size: f.size })) { invalidos.push(f.name); continue; }
    if (sku.tiene_imagen && !m.reemplazar) { yaTienen.push(f.name); continue; }
    coinciden.push({ archivo: f, sku });
  }
  return { coinciden, sinSku, yaTienen, invalidos };
}
function elegirArchivosImportacion(lista) {
  const m = estado.modal;
  m.archivos = [...lista].filter(f => /\.(jpe?g|png|webp)$/i.test(f.name)); m.error = m.archivos.length ? null : 'No se encontró ninguna imagen JPG, PNG o WEBP en lo que elegiste.';
  render();

async function iniciarImportacion() {
  const m = estado.modal;
  const { coinciden } = planImportacion(m);
  if (!coinciden.length) { m.error = 'No hay imágenes para subir con esta selección.'; render(); return; }
  m.fase = 'subiendo'; m.enviando = true; m.total = coinciden.length; m.hecho = 0; m.errores = []; render();
  const cola = [...coinciden];
  const trabajador = async () => {
    while (cola.length && !m.cancelar) {
      const { archivo, sku } = cola.shift();
      try { await DataService.subirImagenSku(sku.id, archivo); }
      catch (e) { m.errores.push(`${sku.clave}: ${e.message}`); }

  };

  recargarAdminSilencioso();
}

<!-- ===== 5. REGLAS DE NEGOCIO Y VALIDACIONES ===== -->
<script>
const ROLES = { INGENIERO: 1, JEFE: 2, CONSULTA: 3, OPERADOR: 4 };
const ESTATUS_SKU = { ACTIVO: 1, DESCONTINUADO: 2 };
const NOMBRES_ROL = { 1: 'Ingeniero', 2: 'Gerente de ingeniería', 3: 'Auditor de calidad', 4: 'Operador' };

/* Quién puede hacer qué. ver: los tres roles; marcar/desmarcar: ingeniero y jefe; administrar: solo jefe. */
const PERMISOS = {
  ver: [ROLES.INGENIERO, ROLES.JEFE, ROLES.CONSULTA],
  marcar: [ROLES.INGENIERO, ROLES.JEFE],
  administrar: [ROLES.JEFE],                                   // usuarios, máquinas, eliminar SKUs, desactivar catálogos
  altas: [ROLES.INGENIERO, ROLES.JEFE],                        // dar de alta y editar SKUs, familias y líneas
  documentos: [ROLES.INGENIERO, ROLES.JEFE, ROLES.CONSULTA],
  subir_documentos: [ROLES.INGENIERO, ROLES.JEFE],
  prototipos: [ROLES.INGENIERO],               // mandar a cortar prototipos (solo ingenieros, no el gerente)
  observar: [ROLES.CONSULTA],                  // señalar y reabrir observaciones de calidad (solo el auditor)
  resolver: [ROLES.INGENIERO, ROLES.JEFE]      // marcar observaciones como resueltas
};
function puede(rolId, accion) { return (PERMISOS[accion] || []).includes(rolId); }

const LIMITES = { imagenMaxMb: 10, causaMin: 10, causaMax: 255, claveMax: 30, descripcionMax: 150, observacionesMax: 1000, nombreCatalogoMax: 60 };

/* Al desmarcar, la causa es obligatoria y debe decir algo útil (mínimo 10 caracteres). */
function validarCausa(texto) {
  const t = String(texto || '').trim();
  if (!t) return 'Escribe la causa por la que desmarcas este entregable.';
  if (t.length < LIMITES.causaMin) return `Describe la causa con un poco más de detalle (mínimo ${LIMITES.causaMin} caracteres).`;
  if (t.length > LIMITES.causaMax) return `La causa no puede pasar de ${LIMITES.causaMax} caracteres.`;
  return null;
}

/* Imagen de referencia: JPG, PNG o WEBP de hasta 10 MB; se optimiza en el navegador antes de guardarse. */
const TIPOS_IMAGEN = ['image/jpeg', 'image/png', 'image/webp'];
function validarImagen({ type, size }) {
  if (!TIPOS_IMAGEN.includes(type)) return 'La imagen debe ser JPG, PNG o WEBP.';
  if (size > LIMITES.imagenMaxMb * 1024 * 1024) return `La imagen no puede pesar más de ${LIMITES.imagenMaxMb} MB.`;
  return null;
}

/* La clave se guarda en mayúsculas y sin espacios: "sil 12a" → "SIL12A". */
function normalizarClave(clave) { return String(clave || '').trim().toUpperCase().replace(/\s+/g, ''); }
function limpiarDatosSku(d) {
  return {
    clave: normalizarClave(d.clave), descripcion: String(d.descripcion || '').trim(),
    familia_id: d.familia_id ? Number(d.familia_id) : null, ...(d.linea_id ? { linea_id: Number(d.linea_id) } : {}), estatus_sku_id: d.estatus_sku_id ? Number(d.estatus_sku_id) : null,
    observaciones: String(d.observaciones || '').trim() || null
  };
}
function validarSku(d, skusExistentes, idActual) {
  const e = {};
  if (!d.clave) e.clave = 'Escribe el SKU.';
  else if (!/^[A-Z0-9][A-Z0-9-]*$/.test(d.clave)) e.clave = 'Usa solo letras, números y guiones (por ejemplo SIL-12A).';
  else if (d.clave.length > LIMITES.claveMax) e.clave = `El SKU no puede pasar de ${LIMITES.claveMax} caracteres.`;
  else if (skusExistentes.some(s => s.id !== idActual && normalizarClave(s.clave) === d.clave)) e.clave = `Ya existe el SKU ${d.clave}.`;
  if (!d.descripcion) e.descripcion = 'Escribe la descripción.';
  else if (d.descripcion.length > LIMITES.descripcionMax) e.descripcion = `La descripción no puede pasar de ${LIMITES.descripcionMax} caracteres.`;
  if (!d.familia_id) e.familia_id = 'Elige la familia.';
  if (!d.estatus_sku_id) e.estatus_sku_id = 'Elige el estatus.';
  if (d.observaciones && d.observaciones.length > LIMITES.observacionesMax) e.observaciones = `Las observaciones no pueden pasar de ${LIMITES.observacionesMax} caracteres.`;
  return Object.keys(e).length ? e : null;
}
function validarNombreCatalogo(nombre, existentes, idActual, entidad) {
  const n = String(nombre || '').trim();
  const art = { familia: 'la familia', linea: 'la línea', entregable: 'el entregable', area: 'el área', tipo: 'el tipo de documento', maquina: 'la máquina' }[entidad];
  if (!n) return `Escribe el nombre de ${art}.`;
  if (n.length > LIMITES.nombreCatalogoMax) return `El nombre no puede pasar de ${LIMITES.nombreCatalogoMax} caracteres.`;
  if (existentes.some(x => x.id !== idActual && normalizarTexto(x.nombre) === normalizarTexto(n))) return `Ya existe ${{ familia: 'una familia', linea: 'una línea', entregable: 'un entregable', area: 'un área', tipo: 'un tipo de documento', maquina: 'una máquina' }[entidad]} con ese nombre.`;
  return null;
}
/* Formularios de acceso. Contraseñas de mínimo 8 caracteres (configura lo mismo en Supabase → Authentication). */
function validarFormularioAuth(pantalla, d) {
  const correoValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);
  if (pantalla === 'registro' && !d.nombre.trim()) return 'Escribe tu nombre completo.';
  if (pantalla !== 'nueva_password' && !correoValido) return 'Escribe un correo válido.';
  if (pantalla === 'recuperar') return null;
  if (!d.password) return 'Escribe tu contraseña.';
  if (pantalla !== 'login' && d.password.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
  if (pantalla !== 'login' && !(/[A-Za-z]/.test(d.password) && /\d/.test(d.password))) return 'La contraseña debe combinar letras y números.';
  if (pantalla !== 'login' && d.password !== d.confirmar) return 'Las contraseñas no coinciden.';
  return null;
}

/* Periodos del reporte: semanas de lunes a domingo y meses naturales, los 12 más recientes (el primero es el que está en curso). */
function periodosReporte(tipo) {
  const hoy = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const corta = d => d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }).replace('.', '');
  const lista = [];
  if (tipo === 'semanal') {
    const lunes = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - ((hoy.getDay() + 6) % 7));
    for (let i = 0; i < 12; i++) {
      const desde = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() - 7 * i);
      const hasta = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate() + 7);
      const domingo = new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate() - 1);
      const etiqueta = `Semana del ${corta(desde)} al ${corta(domingo)} ${domingo.getFullYear()}${i === 0 ? ' (en curso)' : ''}`;
      lista.push({ valor: iso(desde), etiqueta, titulo: `Semana del ${corta(desde)} al ${corta(domingo)} de ${domingo.getFullYear()}`, desde, hasta });
    }
  } else {
    for (let i = 0; i < 12; i++) {
      const desde = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
      const hasta = new Date(desde.getFullYear(), desde.getMonth() + 1, 1);
      const mes = desde.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
      const titulo = mes.charAt(0).toUpperCase() + mes.slice(1);
      lista.push({ valor: iso(desde), etiqueta: titulo + (i === 0 ? ' (en curso)' : ''), titulo, desde, hasta });
    }
  }
  return lista;
}

/* Documentos de corte: formato permitido por tipo, cambios obligatorios desde la versión 2 y nombre de descarga con versión. */
const LIMITE_DOCUMENTO_MB = 20;
function extensionDe(nombre) { const m = /\.([A-Za-z0-9]+)$/.exec(nombre || ''); return m ? m[1].toLowerCase() : ''; }
function validarArchivoDocumento(archivo, tipo) {
  if (!archivo) return 'Elige el archivo.';
  const permitidas = String(tipo.extensiones || '').split(',').filter(Boolean);
  if (!permitidas.includes(extensionDe(archivo.name))) return `Este tipo de documento solo acepta archivos ${permitidas.map(x => '.' + x).join(' o ')}.`;
  if (archivo.size <= 0) return 'El archivo está vacío.';
  if (archivo.size > LIMITE_DOCUMENTO_MB * 1024 * 1024) return `El archivo no puede pesar más de ${LIMITE_DOCUMENTO_MB} MB.`;
  return null;

/* COMPONENTE: EspacioDrive — cuánto ocupan los archivos de corte */
function EspacioDrive() {
  const e = estado.corte.espacio;
  if (!e) return null;
  const guardado = Number(e.bytes_guardados || 0), original = Number(e.bytes_originales || 0);
  const ahorro = original ? Math.round(100 - guardado * 100 / original) : 0;
  const enDrive = e.cuenta && e.cuenta.bytes ? Number(e.cuenta.bytes) : guardado;
  const LIMITE = 15 * 1024 * 1024 * 1024; // 15 GB de una cuenta gratuita de Google
  const pct = Math.round(enDrive * 100 / LIMITE);
  const nivel = pct >= 95 ? 'critico' : pct >= 80 ? 'aviso' : 'normal';
  const color = nivel === 'critico' ? 'bg-[#B42318] dark:bg-[#C8372B]' : nivel === 'aviso' ? 'bg-[#C98A1B] dark:bg-[#D9A03A]' : 'bg-[#1E4E79] dark:bg-[#2F6DA3]';

    h('div', { class: 'flex flex-wrap items-baseline justify-between gap-2' },
      h('h2', { class: 'text-base font-semibold' }, 'Espacio de los archivos de corte'),

      h('div', { class: `h-full rounded-full ${color} w-[${Math.min(100, Math.max(pct, 1))}%]` })),
    h('p', { class: `mt-2 text-sm ${nivel === 'normal' ? 'text-[#5B6675] dark:text-[#9AA7B6]' : 'font-medium text-[#B26A00] dark:text-[#E0A650]'}` },
      nivel !== 'normal' ? icono('alerta', 'mr-1 inline w-4 h-4 align-[-2px]') : null,

/* COMPONENTE: DonaReporte — gráfica de SKUs completos para el reporte (SVG, colores fijos para impresión) */
function DonaReporte(d) {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, ...hijos) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); hijos.forEach(x => e.append(x)); return e; };
  const r = 46, C = 2 * Math.PI * r;
  const partes = [['Completos', d.completos, '#1F7A4D'], ['En proceso', d.en_proceso, '#C98A1B'], ['Sin iniciar', d.sin_iniciar, '#B8C1CB']];
  const svg = el('svg', { viewBox: '0 0 120 120', class: 'h-40 w-40 shrink-0', role: 'img', 'aria-label': `${d.porcentaje_global}% de SKUs completos: ${d.completos} de ${d.total}` });
  svg.append(el('circle', { cx: 60, cy: 60, r, fill: 'none', stroke: '#E3E7EC', 'stroke-width': 16 }));
  let acumulado = 0;
  for (const [, valor, color] of partes) {
    if (!valor || !d.total) continue;
    const largo = (valor / d.total) * C;
    svg.append(el('circle', { cx: 60, cy: 60, r, fill: 'none', stroke: color, 'stroke-width': 16, 'stroke-dasharray': `${largo} ${C - largo}`, 'stroke-dashoffset': -acumulado, transform: 'rotate(-90 60 60)' }));
    acumulado += largo;
  }
  const t1 = el('text', { x: 60, y: 60, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 600, fill: '#1B2430', 'font-family': 'IBM Plex Sans, system-ui, sans-serif' }); t1.textContent = `${d.porcentaje_global}%`;
  const t2 = el('text', { x: 60, y: 75, 'text-anchor': 'middle', 'font-size': 7.5, fill: '#5B6675', 'font-family': 'IBM Plex Sans, system-ui, sans-serif' }); t2.textContent = `${d.completos} de ${d.total} SKUs`;
  svg.append(t1, t2);
  const color = { '#1F7A4D': 'bg-[#1F7A4D]', '#C98A1B': 'bg-[#C98A1B]', '#B8C1CB': 'bg-[#B8C1CB]' };
  return h('div', { class: 'flex items-center gap-5 py-2' }, svg,
    h('ul', { class: 'min-w-0 flex-1 space-y-2 whitespace-nowrap text-xs' }, partes.map(([nombre, valor, c]) => h('li', { class: 'flex items-center gap-3' },
      h('span', { class: `h-3 w-3 shrink-0 rounded-sm ${color[c]}`, 'aria-hidden': 'true' }), h('span', { class: 'flex-1' }, nombre),
      h('span', { class: 'tabular-nums text-[#5B6675]' }, `${valor} ${valor === 1 ? 'SKU' : 'SKUs'}`),
      h('span', { class: 'w-10 text-right font-semibold tabular-nums' }, `${calcularPorcentaje(valor, d.total)}%`)))));
}
