<!-- ===== 0. DECISIONES DE DISEÑO =====
  Aplicativo:      Ingeniería de producto — control de entregables de ingeniería por SKU del catálogo
  Versión:         producción sobre Supabase + GitHub Pages
  Paleta:
    Primario        #1E4E79   (azul acero, tinta de plano técnico)
    Primario hover  #163B5C
    Acento          #C98A1B   (ámbar: "en proceso")
    Éxito           #1F7A4D   (verde: entregable correcto / SKU completo)
    Éxito fondo     #E6F2EB   (celda marcada en la matriz)
    Advertencia     #B26A00
    Error           #B42318
    Texto           #1B2430
    Texto suave     #5B6675
    Bordes          #D5DBE2   (bordes internos de tabla: #E3E7EC)
    Fondo           #EEF1F4
    Superficie      #FFFFFF
    Encabezado tabla #F7F9FA
    Aviso informativo #FFF4DB con borde #E9D29B y texto #5C4410
  Tipografía:      IBM Plex Sans (Google Fonts) — títulos 600, etiquetas 500, cuerpo 400.
                   Números con tabular-nums para que claves y porcentajes alineen en columna.
  Radio de bordes: rounded-md en controles, tablas y paneles; rounded-lg solo en diálogos.
  Sombras:         ninguna en paneles (se separan con borde); shadow-xl en diálogos, shadow-md en avisos.
  Densidad:        compacta en la matriz (celdas de 44 px de alto), cómoda en formularios.
  Elemento central: la matriz SKU × entregable. Todo lo demás es sobrio para que la matriz mande.
  Estatus:         nunca solo por color — celda marcada lleva ícono ✓, el avance lleva texto
                   ("Completo", "5 de 7", "Sin iniciar") y el historial dice "Marcó correcto" / "Desmarcó".
  Modo oscuro (clase "dark" en <html>, variantes dark: de Tailwind):
    Fondo #10151B, Superficie #18202A, Encabezado tabla #1F2833, Hover #243040
    Bordes #2E3A48 (internos #26313D, controles #3A4756)
    Texto #E6EAEF, Texto suave #9AA7B6
    Primario botón #2F6DA3 (hover #3A7DB8), Primario texto/enlaces/foco #7FB2E5
    Éxito texto #5CC48E, barras #2E9A63, celda marcada #173526
    Error texto #F28B82, botón #C8372B, fondo aviso #3A1D1B
    Ámbar #D9A03A; banda prototipo #3A2F14
    Las imágenes de referencia conservan fondo claro para que se distingan.
  Tema inicial:    el del sistema operativo; la elección de cada persona se recuerda en su navegador.
  Notas:           uso principal en computadora, la matriz se desplaza en pantallas chicas.
-->

<script>
class ErrorApi extends Error {
  constructor(mensaje, { tipo = 'servidor', campos = null } = {}) { super(mensaje); this.tipo = tipo; this.campos = campos; }
}
const esperar = ms => new Promise(r => setTimeout(r, ms));
const claveUnica = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
function errorDe(error) {
  if (!error) return null;
  if (error instanceof ErrorApi) return error;
  const msg = String(error.message || '');
  if (['conflicto', 'validacion', 'permiso', 'no_encontrado'].includes(error.hint)) return new ErrorApi(msg, { tipo: error.hint });
  if (error.code === '23505') return new ErrorApi('Ya existe un registro con ese nombre.', { tipo: 'duplicado' });
  if (error.code === '23514') return new ErrorApi('Algún dato no tiene el formato correcto.', { tipo: 'validacion' });
  if (error.code === '42501') return new ErrorApi('Tu rol no tiene permiso para esta acción.', { tipo: 'permiso' });
  if (error.code === 'PGRST301' || /jwt/i.test(msg)) return new ErrorApi('Tu sesión expiró. Vuelve a iniciar sesión.', { tipo: 'sesion' });
  if (/fetch|network|load failed/i.test(msg)) return new ErrorApi('No se pudo conectar con el servidor. Revisa tu conexión a internet.', { tipo: 'conexion' });
  return new ErrorApi(msg || 'Ocurrió un error inesperado.');
}
async function ejecutar(consulta) {
  let r;
  try { r = await consulta; } catch (e) { throw errorDe(e); }
  const err = errorDe(r.error);
  if (err) { if (err.tipo === 'sesion') setTimeout(() => cerrarSesion(), 0); throw err; }
  return r;
}
/* Supabase regresa máximo 1000 filas por consulta: se piden por páginas. */
async function leerTodo(fabrica) {
  const todo = [];
  for (let desde = 0; ; desde += 1000) {
    const { data } = await ejecutar(fabrica().range(desde, desde + 999));
    todo.push(...(data || []));
    if (!data || data.length < 1000) return todo;
  }
}
async function exigirFilas(consulta, mensaje = 'Tu rol no tiene permiso para esta acción.') {
  const { data } = await ejecutar(consulta);
  if (!data || !data.length) throw new ErrorApi(mensaje, { tipo: 'permiso' });
  return data;
}
function exigirPermiso(accion) { if (!estado.sesion || !puede(estado.sesion.rol_id, accion)) throw new ErrorApi('Tu rol no tiene permiso para esta acción.', { tipo: 'permiso' }); }
const porId = filas => Object.fromEntries(filas.map(f => [String(f.id), f]));
const listaCatalogo = obj => Object.values(obj || {}).map(v => ({ ...v, id: Number(v.id) }));
const vivosSkus = () => [...cache.skus.values()];
function entregablesActivos() { return listaCatalogo(cache.entregables).filter(e => e.activo).sort((a, b) => a.orden - b.orden); }
function nombreCorto(id) { return (id && cache.perfiles[id] && cache.perfiles[id].nombre) || 'Usuario'; }
function skuVivo(id) {
  const s = cache.skus.get(Number(id));
  if (!s) throw new ErrorApi('Ese SKU ya no existe. La lista ya se actualizó.', { tipo: 'no_encontrado' });
  return s;
}
function normalizarSku(f) {
  const casillas = {};
  for (const [k, v] of Object.entries(f.casillas || {})) casillas[k] = { completado: !!v.c, por: v.por || null, en: v.en || null };
  return { ...f, id: Number(f.id), familia_id: Number(f.familia_id), estatus_sku_id: Number(f.estatus_sku_id), casillas };
}
function avanceDeSku(sku, ents) {
  const casillas = ents.map(e => {
    const c = sku.casillas[String(e.id)];
    const hecho = !!(c && c.completado);
    return { entregable_id: e.id, nombre: e.nombre, completado: hecho, completado_por: hecho ? c.por : null, completado_por_nombre: hecho ? nombreCorto(c.por) : null, completado_en: hecho ? c.en : null };
  });
  const completados = casillas.filter(c => c.completado).length;
  return { casillas, completados, total: ents.length, porcentaje: calcularPorcentaje(completados, ents.length), estado_avance: estadoAvance(completados, ents.length) };
}
function skuConAvance(sku, ents) {
  const fam = cache.familias[String(sku.familia_id)];
  const est = cache.estatus[String(sku.estatus_sku_id)];
  return {
    id: sku.id, clave: sku.clave, descripcion: sku.descripcion, familia_id: sku.familia_id, estatus_sku_id: sku.estatus_sku_id,
    observaciones: sku.observaciones || null, miniatura: sku.miniatura || null, tiene_imagen: !!sku.imagen_ruta, imagen_ruta: sku.imagen_ruta || null,
    familia_nombre: fam ? fam.nombre : '—', estatus_nombre: est ? est.nombre : '—',
    descontinuado: sku.estatus_sku_id === ESTATUS_SKU.DESCONTINUADO, ...avanceDeSku(sku, ents)
  };
}
function registroHistorial(r) {
  return {
    id: r.id, fecha: r.fecha, marcado: !!r.marcado, comentario: r.comentario || null, user_id: r.user_id,
    usuario_nombre: r.usuario_nombre || nombreCorto(r.user_id), sku_id: r.sku_id, sku_clave: r.sku_clave, sku_eliminado: !!r.sku_eliminado,
    entregable_id: r.entregable_id, entregable_nombre: r.entregable_nombre
  };
}
function consultaHistorial(filtros = {}) {
  let q = SB.from('ing_v_historial').select('*', { count: 'exact' }).order('fecha', { ascending: false }).order('id', { ascending: false });
  if (filtros.sku_id) q = q.eq('sku_id', filtros.sku_id);
  if (filtros.busqueda) q = q.ilike('sku_clave', `%${String(filtros.busqueda).trim().replace(/[%_\\]/g, m => '\\' + m)}%`);
  if (filtros.user_id) q = q.eq('user_id', filtros.user_id);
  if (filtros.marcado === '1') q = q.eq('marcado', true);
  if (filtros.marcado === '0') q = q.eq('marcado', false);
  if (filtros.entregable_id) q = q.eq('entregable_id', Number(filtros.entregable_id));
  return q;
}
async function urlImagen(ruta) {
  const c = urlsFirmadas.get(ruta);
  if (c && c.vence > Date.now()) return c.url;
  try {
    const { data } = await ejecutar(SB.storage.from(BUCKET_IMAGENES).createSignedUrl(ruta, 3600));
    urlsFirmadas.set(ruta, { url: data.signedUrl, vence: Date.now() + 50 * 60 * 1000 });
    return data.signedUrl;
  } catch (e) { return null; }
}
/* Reduce la imagen en el navegador: completa (máx. 1200 px, < ~250 KB) y miniatura (96 px). */
function leerComoDataUrl(archivo) {
  return new Promise((ok, falla) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => falla(new ErrorApi('No se pudo leer la imagen.')); r.readAsDataURL(archivo); });
}
function cargarImagen(src) {
  return new Promise((ok, falla) => { const img = new Image(); img.onload = () => ok(img); img.onerror = () => falla(new ErrorApi('El archivo no es una imagen válida.', { tipo: 'validacion', campos: { imagen: 'El archivo no es una imagen válida.' } })); img.src = src; });
}
function redimensionar(img, lado, calidad) {
  const escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * escala)); c.height = Math.max(1, Math.round(img.naturalHeight * escala));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', calidad);
}
async function prepararImagen(archivo) {
  const img = await cargarImagen(await leerComoDataUrl(archivo));
  let lado = 1200, calidad = 0.85, completa = redimensionar(img, lado, calidad);
  while (completa.length > 340000 && lado > 300) { if (calidad > 0.6) calidad -= 0.1; else lado = Math.round(lado * 0.8); completa = redimensionar(img, lado, calidad); }
  return { completa, miniatura: redimensionar(img, 96, 0.8) };
}
function dataUrlABlob(dataUrl) {
  const [cab, datos] = dataUrl.split(',');
  const bin = atob(datos); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: cab.slice(5, cab.indexOf(';')) });
}

const DataService = {
  /* ---------- Sesión (Supabase Auth) ---------- */
  async iniciarSesion(email, password) {
    const { data, error } = await SB.auth.signInWithPassword({ email, password });
    if (error) {
      if (/confirm/i.test(error.message)) throw new ErrorApi('Confirma tu correo primero: abre el enlace que te enviamos al registrarte.', { tipo: 'credenciales' });
      if (/invalid/i.test(error.message)) throw new ErrorApi('Correo o contraseña incorrectos.', { tipo: 'credenciales' });
      throw errorDe(error);
    }
    return data.user;
  },
  async registrarse({ nombre, email, password }) {
    const { data, error } = await SB.auth.signUp({ email, password, options: { data: { nombre }, emailRedirectTo: urlApp() } });
    if (error) {
      if (/registered|exists/i.test(error.message)) throw new ErrorApi('Ya existe una cuenta con ese correo. Inicia sesión o recupera tu contraseña.', { tipo: 'validacion' });
      if (/password/i.test(error.message)) throw new ErrorApi('La contraseña no cumple los requisitos de seguridad. Usa al menos 8 caracteres con letras y números.', { tipo: 'validacion' });
      if (/rate|security purposes/i.test(error.message)) throw new ErrorApi('Se hicieron demasiados intentos. Espera unos minutos e intenta de nuevo.', { tipo: 'limite' });
      throw errorDe(error);
    }
    return { usuario: data.user, conSesion: !!data.session };
  },
  async recuperarPassword(email) {
    const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: urlApp() });
    if (error && /rate|security purposes/i.test(error.message)) throw new ErrorApi('Ya se envió un correo hace poco. Espera unos minutos antes de pedir otro.', { tipo: 'limite' });
    if (error) throw errorDe(error);
  },
  async cambiarPassword(password) {
    const { data, error } = await SB.auth.updateUser({ password });
    if (error) {
      if (/different|same/i.test(error.message)) throw new ErrorApi('La nueva contraseña debe ser distinta de la anterior.', { tipo: 'validacion' });
      throw errorDe(error);
    }
    return data.user;
  },
  async cerrarSesion() { try { await SB.auth.signOut(); } catch (e) { /* se cierra localmente de todos modos */ } },
  async obtenerMiPerfil(userId) {
    const { data } = await ejecutar(SB.from('ing_perfiles').select('id,nombre,email,rol_id,activo').eq('id', userId).maybeSingle());
    return data;
  },

  /* ---------- Carga general ---------- */
  async recargarTodo() {
    const [fam, ent, est, per, skus] = await Promise.all([
      leerTodo(() => SB.from('ing_familias').select('id,nombre,activa').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_entregables').select('id,nombre,orden,activo').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_estatus_sku').select('id,nombre').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_perfiles').select('id,nombre,email,rol_id,activo').is('deleted_at', null).order('id')),
      leerTodo(() => SB.from('ing_v_skus').select('*').order('id'))
    ]);
    cache.familias = porId(fam); cache.entregables = porId(ent); cache.estatus = porId(est);
    cache.perfiles = Object.fromEntries(per.map(p => [p.id, p]));
    cache.skus = new Map(skus.map(f => { const s = normalizarSku(f); return [s.id, s]; }));
  },

  /* ---------- SKUs ---------- */
  async listarSkus(filtros = {}) {
    const ents = entregablesActivos();
    let lista = vivosSkus().map(s => skuConAvance(s, ents));
    if (!filtros.incluir_descontinuados) lista = lista.filter(s => !s.descontinuado);
    if (filtros.busqueda) { const q = normalizarTexto(filtros.busqueda); lista = lista.filter(s => normalizarTexto(`${s.clave} ${s.descripcion}`).includes(q)); }
    if (filtros.familia_id) lista = lista.filter(s => s.familia_id === Number(filtros.familia_id));
    if (filtros.avance && filtros.avance !== 'todos') lista = lista.filter(s => s.estado_avance === filtros.avance);
    if (filtros.pendiente_entregable_id) { const id = Number(filtros.pendiente_entregable_id); lista = lista.filter(s => s.casillas.some(c => c.entregable_id === id && !c.completado)); }
    lista.sort((a, b) => compararNatural(a.clave, b.clave));
    return { skus: lista, entregables: ents.map(e => ({ id: e.id, nombre: e.nombre })) };
  },
  async obtenerSku(id) {
    const sku = skuVivo(id);
    const r = skuConAvance(sku, entregablesActivos());
    const [{ data }, url] = await Promise.all([ejecutar(consultaHistorial({ sku_id: sku.id }).range(0, 299)), sku.imagen_ruta ? urlImagen(sku.imagen_ruta) : null]);
    r.historial = (data || []).map(registroHistorial);
    r.imagen_url = url;
    return r;
  },
  async crearSku(datos) {
    exigirPermiso('administrar');
    const limpio = limpiarDatosSku(datos);
    const errores = validarSku(limpio, vivosSkus(), null);
    if (errores) throw new ErrorApi('Revisa los campos marcados.', { tipo: 'validacion', campos: errores });
    try {
      const { data } = await ejecutar(SB.from('ing_skus').insert(limpio).select('id').single());
      programarRecarga(0);
      return { id: data.id, ...limpio };
    } catch (e) {
      if (e.tipo === 'duplicado') throw new ErrorApi('Revisa los campos marcados.', { tipo: 'validacion', campos: { clave: `Ya existe el SKU ${limpio.clave}.` } });
      throw e;
    }
  },
  async actualizarSku(id, datos) {
    exigirPermiso('administrar');
    const sku = skuVivo(id);
    const limpio = limpiarDatosSku(datos);
    const errores = validarSku(limpio, vivosSkus(), sku.id);
    if (errores) throw new ErrorApi('Revisa los campos marcados.', { tipo: 'validacion', campos: errores });
    try { await exigirFilas(SB.from('ing_skus').update(limpio).eq('id', sku.id).select('id')); }
    catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Revisa los campos marcados.', { tipo: 'validacion', campos: { clave: `Ya existe el SKU ${limpio.clave}.` } }); throw e; }
    Object.assign(sku, limpio);
    programarRecarga(0);
    return skuConAvance(sku, entregablesActivos());
  },
  async eliminarSku(id) {
    exigirPermiso('administrar');
    const sku = skuVivo(id);
    await exigirFilas(SB.from('ing_skus').update({ deleted_at: new Date().toISOString(), imagen_ruta: null, miniatura: null }).eq('id', sku.id).select('id'));
    if (sku.imagen_ruta) SB.storage.from(BUCKET_IMAGENES).remove([sku.imagen_ruta]).catch(() => {});
    cache.skus.delete(sku.id);
    programarRecarga(0);
    return { id: sku.id, clave: sku.clave };
  },
  async marcarEntregable(skuId, entregableId, comentario = null) {
    exigirPermiso('marcar');
    const sku = skuVivo(skuId);
    await ejecutar(SB.rpc('ing_marcar', { p_sku: sku.id, p_entregable: entregableId, p_comentario: comentario }));
    sku.casillas[String(entregableId)] = { completado: true, por: estado.sesion.user_id, en: new Date().toISOString() };
    programarRecarga();
    return skuConAvance(sku, entregablesActivos());
  },
  async desmarcarEntregable(skuId, entregableId, causa) {
    exigirPermiso('marcar');
    const errorCausa = validarCausa(causa);
    if (errorCausa) throw new ErrorApi(errorCausa, { tipo: 'validacion', campos: { causa: errorCausa } });
    const sku = skuVivo(skuId);
    await ejecutar(SB.rpc('ing_desmarcar', { p_sku: sku.id, p_entregable: entregableId, p_causa: String(causa).trim() }));
    sku.casillas[String(entregableId)] = { completado: false, por: null, en: null };
    programarRecarga();
    return skuConAvance(sku, entregablesActivos());
  },
  async subirImagenSku(id, archivo) {
    exigirPermiso('marcar');
    const err = validarImagen({ type: archivo ? archivo.type : '', size: archivo ? archivo.size : 0 });
    if (err) throw new ErrorApi(err, { tipo: 'validacion', campos: { imagen: err } });
    const sku = skuVivo(id);
    const { completa, miniatura } = await prepararImagen(archivo);
    const ruta = `sku-${sku.id}/${claveUnica()}.jpg`;
    await ejecutar(SB.storage.from(BUCKET_IMAGENES).upload(ruta, dataUrlABlob(completa), { contentType: 'image/jpeg', upsert: false }));
    const { data: anterior } = await ejecutar(SB.rpc('ing_poner_imagen', { p_sku: sku.id, p_ruta: ruta, p_miniatura: miniatura }));
    if (anterior) SB.storage.from(BUCKET_IMAGENES).remove([anterior]).catch(() => {});
    Object.assign(sku, { imagen_ruta: ruta, miniatura });
    programarRecarga();
    return { ...skuConAvance(sku, entregablesActivos()), imagen_url: completa };
  },
  async quitarImagenSku(id) {
    exigirPermiso('marcar');
    const sku = skuVivo(id);
    const { data: anterior } = await ejecutar(SB.rpc('ing_quitar_imagen', { p_sku: sku.id }));
    if (anterior) SB.storage.from(BUCKET_IMAGENES).remove([anterior]).catch(() => {});
    Object.assign(sku, { imagen_ruta: null, miniatura: null });
    programarRecarga();
    return skuConAvance(sku, entregablesActivos());
  },

  /* ---------- Tablero e historial ---------- */
  async obtenerTablero() {
    const ents = entregablesActivos();
    const activos = vivosSkus().filter(s => s.estatus_sku_id === ESTATUS_SKU.ACTIVO).map(s => skuConAvance(s, ents));
    const cuenta = est => activos.filter(s => s.estado_avance === est).length;
    const completos = cuenta('completo');
    const por_familia = listaCatalogo(cache.familias).map(f => {
      const de = activos.filter(s => s.familia_id === f.id);
      const listos = de.filter(s => s.estado_avance === 'completo').length;
      return { id: f.id, nombre: f.nombre, total: de.length, completos: listos, porcentaje: calcularPorcentaje(listos, de.length) };
    }).filter(f => f.total > 0).sort((a, b) => compararNatural(a.nombre, b.nombre));
    return {
      total: activos.length, completos, en_proceso: cuenta('en_proceso'), sin_iniciar: cuenta('sin_iniciar'),
      porcentaje_global: calcularPorcentaje(completos, activos.length),
      por_entregable: ents.map(e => {
        const listos = activos.filter(s => s.casillas.some(c => c.entregable_id === e.id && c.completado)).length;
        return { id: e.id, nombre: e.nombre, completos: listos, porcentaje: calcularPorcentaje(listos, activos.length) };
      }),
      por_familia
    };
  },
  async listarHistorial(filtros = {}) {
    const { data, count } = await ejecutar(consultaHistorial(filtros).range(0, (filtros.limite || 50) - 1));
    const usuarios = Object.values(cache.perfiles).filter(p => p.rol_id).map(p => ({ id: p.id, nombre: p.nombre })).sort((a, b) => compararNatural(a.nombre, b.nombre));
    return { registros: (data || []).map(registroHistorial), total: count || 0, usuarios };
  },
  async exportarHistorial() {
    return (await leerTodo(() => consultaHistorial({}))).map(registroHistorial);
  },

  /* ---------- Catálogos ---------- */
  async listarFamilias({ incluir_inactivas = false } = {}) {
    const skus = vivosSkus();
    return listaCatalogo(cache.familias).filter(f => incluir_inactivas || f.activa)
      .map(f => ({ id: f.id, nombre: f.nombre, activa: !!f.activa, skus: skus.filter(s => s.familia_id === f.id).length }))
      .sort((a, b) => compararNatural(a.nombre, b.nombre));
  },
  async crearFamilia({ nombre }) {
    exigirPermiso('administrar');
    const err = validarNombreCatalogo(nombre, listaCatalogo(cache.familias), null, 'familia');
    if (err) throw new ErrorApi(err, { tipo: 'validacion', campos: { nombre: err } });
    try { const { data } = await ejecutar(SB.from('ing_familias').insert({ nombre: nombre.trim() }).select('id,nombre,activa').single()); programarRecarga(0); return data; }
    catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Ya existe una familia con ese nombre.', { tipo: 'validacion', campos: { nombre: 'Ya existe una familia con ese nombre.' } }); throw e; }
  },
  async actualizarFamilia(id, datos) {
    exigirPermiso('administrar');
    const cambio = {};
    if (datos.nombre !== undefined) {
      const err = validarNombreCatalogo(datos.nombre, listaCatalogo(cache.familias), id, 'familia');
      if (err) throw new ErrorApi(err, { tipo: 'validacion', campos: { nombre: err } });
      cambio.nombre = datos.nombre.trim();
    }
    if (datos.activa !== undefined) cambio.activa = !!datos.activa;
    try { const [f] = await exigirFilas(SB.from('ing_familias').update(cambio).eq('id', id).select('id,nombre,activa')); programarRecarga(0); return f; }
    catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Ya existe una familia con ese nombre.', { tipo: 'validacion', campos: { nombre: 'Ya existe una familia con ese nombre.' } }); throw e; }
  },
  async listarEntregables({ incluir_inactivos = false } = {}) {
    return listaCatalogo(cache.entregables).filter(e => incluir_inactivos || e.activo).sort((a, b) => a.orden - b.orden)
      .map(e => ({ id: e.id, nombre: e.nombre, orden: e.orden, activo: !!e.activo }));
  },
  async crearEntregable({ nombre }) {
    exigirPermiso('administrar');
    const err = validarNombreCatalogo(nombre, listaCatalogo(cache.entregables), null, 'entregable');
    if (err) throw new ErrorApi(err, { tipo: 'validacion', campos: { nombre: err } });
    const orden = listaCatalogo(cache.entregables).reduce((m, e) => Math.max(m, e.orden), 0) + 1;
    try { const { data } = await ejecutar(SB.from('ing_entregables').insert({ nombre: nombre.trim(), orden }).select('id,nombre,orden,activo').single()); programarRecarga(0); return data; }
    catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Ya existe un entregable con ese nombre.', { tipo: 'validacion', campos: { nombre: 'Ya existe un entregable con ese nombre.' } }); throw e; }
  },
  async actualizarEntregable(id, datos) {
    exigirPermiso('administrar');
    const cambio = {};
    if (datos.nombre !== undefined) {
      const err = validarNombreCatalogo(datos.nombre, listaCatalogo(cache.entregables), id, 'entregable');
      if (err) throw new ErrorApi(err, { tipo: 'validacion', campos: { nombre: err } });
      cambio.nombre = datos.nombre.trim();
    }
    if (datos.activo !== undefined) {
      if (!datos.activo && entregablesActivos().length <= 1) throw new ErrorApi('Debe quedar al menos un entregable activo.', { tipo: 'validacion' });
      cambio.activo = !!datos.activo;
    }
    try { const [e] = await exigirFilas(SB.from('ing_entregables').update(cambio).eq('id', id).select('id,nombre')); programarRecarga(0); return e; }
    catch (e) { if (e.tipo === 'duplicado') throw new ErrorApi('Ya existe un entregable con ese nombre.', { tipo: 'validacion', campos: { nombre: 'Ya existe un entregable con ese nombre.' } }); throw e; }
  },
  async reordenarEntregable(id, direccion) {
    exigirPermiso('administrar');
    const lista = listaCatalogo(cache.entregables).sort((a, b) => a.orden - b.orden);
    const i = lista.findIndex(e => e.id === id), j = direccion === 'subir' ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= lista.length) throw new ErrorApi('Ese entregable ya está en el extremo.', { tipo: 'validacion' });
    await exigirFilas(SB.from('ing_entregables').update({ orden: lista[j].orden }).eq('id', lista[i].id).select('id'));
    await exigirFilas(SB.from('ing_entregables').update({ orden: lista[i].orden }).eq('id', lista[j].id).select('id'));
    programarRecarga(0);
  },
  async listarEstatusSku() { return listaCatalogo(cache.estatus).map(e => ({ id: e.id, nombre: e.nombre })); },

  /* ---------- Usuarios ---------- */
  async listarUsuarios() {
    exigirPermiso('administrar');
    const filas = await leerTodo(() => SB.from('ing_perfiles').select('id,nombre,email,rol_id,activo,created_at').is('deleted_at', null).order('created_at'));
    const orden = u => (!u.rol_id ? 0 : u.activo ? 1 : 2);
    return filas.map(u => ({ ...u, estado: !u.rol_id ? 'pendiente' : u.activo ? 'activo' : 'sin_acceso' }))
      .sort((a, b) => orden(a) - orden(b) || compararNatural(a.nombre, b.nombre));
  },
  async actualizarUsuario(id, cambio) {
    exigirPermiso('administrar');
    const [u] = await exigirFilas(SB.from('ing_perfiles').update(cambio).eq('id', id).select('id,nombre,rol_id,activo'));
    programarRecarga(0);
    return u;
  }
};
</script>

<!-- ===== 4. ESTADO DE LA APLICACIÓN ===== -->
<script>
/* Única fuente de verdad de la interfaz. estado.sesion = { user_id, nombre, email, rol_id, rol_nombre }. */
const FILTROS_SKUS_INICIALES = { busqueda: '', familia_id: '', avance: 'todos', pendiente_entregable_id: '', incluir_descontinuados: false };
const FILTROS_HISTORIAL_INICIALES = { busqueda: '', user_id: '', marcado: 'todos', entregable_id: '' };
const DETALLE_VACIO = { abierto: false, sku_id: null, cargando: false, error: null, datos: null, subiendoImagen: false, errorImagen: null };
const AUTH_INICIAL = { pantalla: 'login', nombre: '', email: '', password: '', confirmar: '', error: null, mensaje: null, enviando: false };

function temaInicial() {
  try { const t = localStorage.getItem('ing-tema'); if (t === 'claro' || t === 'oscuro') return t; } catch (e) { /* sin almacenamiento */ }
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
}
const estado = {
  fase: 'iniciando', // iniciando | configuracion | auth | espera | app | error
  errorFatal: null,
  auth: { ...AUTH_INICIAL },
  espera: { motivo: 'pendiente', email: '', revisando: false },
  sesion: null,
  vista: 'skus',
  catalogos: { familias: [], entregables: [], estatus: [] },
  skus: { cargando: false, error: null, datos: null, entregables: [], filtros: { ...FILTROS_SKUS_INICIALES }, celdaGuardando: null },
  detalle: { ...DETALLE_VACIO },
  tablero: { cargando: false, error: null, datos: null },
  historial: { cargando: false, error: null, datos: null, total: 0, usuarios: [], filtros: { ...FILTROS_HISTORIAL_INICIALES }, limite: 50, exportando: false },
  admin: { pestana: 'skus', cargando: false, error: null, skus: null, usuarios: null, familias: null, entregables: null },
  pendientes: 0,
  modal: null,
  tema: temaInicial(),
  avisos: []
};
const temporizadores = {};
function conRetraso(clave, fn, ms = 200) { clearTimeout(temporizadores[clave]); temporizadores[clave] = setTimeout(fn, ms); }
function alternarTema() {
  estado.tema = estado.tema === 'oscuro' ? 'claro' : 'oscuro';
  try { localStorage.setItem('ing-tema', estado.tema); } catch (e) { /* solo en esta visita */ }
  render();
}
const urlApp = () => location.origin + location.pathname;

/* ---------- Arranque y sesión ---------- */
async function arrancar() {
  if (!configurado()) { estado.fase = 'configuracion'; render(); return; }
  if (!window.supabase || typeof window.supabase.createClient !== 'function') { estado.fase = 'error'; estado.errorFatal = 'No se pudo cargar la conexión con el servidor. Revisa tu conexión a internet y recarga la página.'; render(); return; }
  const esRecuperacion = /type=recovery/.test(location.hash);
  SB = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  SB.auth.onAuthStateChange(evento => {
    if (evento === 'PASSWORD_RECOVERY') setTimeout(() => { estado.fase = 'auth'; estado.auth = { ...AUTH_INICIAL, pantalla: 'nueva_password' }; render(); }, 0);
  });
  try {
    const { data } = await SB.auth.getSession();
    if (esRecuperacion && data.session) { estado.fase = 'auth'; estado.auth = { ...AUTH_INICIAL, pantalla: 'nueva_password' }; render(); return; }
    if (data.session) await entrarConSesion(data.session.user); else { estado.fase = 'auth'; render(); }
  } catch (e) { estado.fase = 'error'; estado.errorFatal = errorDe(e).message; render(); }
  if (location.hash && /access_token|error_description/.test(location.hash)) history.replaceState(null, '', urlApp());
}
async function entrarConSesion(usuario) {
  estado.fase = 'iniciando'; render();
  try {
    const perfil = await DataService.obtenerMiPerfil(usuario.id);
    if (!perfil || !perfil.rol_id || !perfil.activo) {
      estado.fase = 'espera'; estado.espera = { motivo: perfil && perfil.rol_id && !perfil.activo ? 'sin_acceso' : 'pendiente', email: usuario.email, revisando: false };
      render(); return;
    }
    const primeraVez = !estado.sesion;
    estado.sesion = { user_id: perfil.id, nombre: perfil.nombre, email: perfil.email, rol_id: Number(perfil.rol_id), rol_nombre: NOMBRES_ROL[perfil.rol_id] };
    await DataService.recargarTodo();
    await cargarCatalogos();
    if (primeraVez) estado.vista = estado.sesion.rol_id === ROLES.INGENIERO ? 'skus' : 'tablero';
    estado.fase = 'app';
    suscribirCambios();
    cargarVista();
  } catch (e) { estado.fase = 'error'; estado.errorFatal = e.message; render(); }
}
async function revisarAcceso() {
  estado.espera.revisando = true; render();
  const { data } = await SB.auth.getSession();
  if (data.session) await entrarConSesion(data.session.user); else { estado.fase = 'auth'; render(); }
}
async function cerrarSesion() {
  if (canal) { SB.removeChannel(canal); canal = null; }
  await DataService.cerrarSesion();
  Object.assign(estado, {
    fase: 'auth', auth: { ...AUTH_INICIAL }, sesion: null, modal: null, detalle: { ...DETALLE_VACIO },
    skus: { cargando: false, error: null, datos: null, entregables: [], filtros: { ...FILTROS_SKUS_INICIALES }, celdaGuardando: null },
    tablero: { cargando: false, error: null, datos: null },
    historial: { cargando: false, error: null, datos: null, total: 0, usuarios: [], filtros: { ...FILTROS_HISTORIAL_INICIALES }, limite: 50, exportando: false },
    admin: { pestana: 'skus', cargando: false, error: null, skus: null, usuarios: null, familias: null, entregables: null }
  });
  cache.skus = new Map(); cache.perfiles = {};
  render();
}

/* ---------- Formularios de acceso ---------- */
function irAPantallaAuth(pantalla) { estado.auth = { ...AUTH_INICIAL, pantalla, email: estado.auth.email }; enfocarDespues = pantalla === 'registro' ? 'auth-nombre' : 'auth-email'; render(); }
async function enviarAuth() {
  const a = estado.auth;
  const email = a.email.trim().toLowerCase();
  const error = validarFormularioAuth(a.pantalla, { ...a, email });
  if (error) { a.error = error; a.mensaje = null; render(); return; }
  a.enviando = true; a.error = null; a.mensaje = null; render();
  try {
    if (a.pantalla === 'login') { const u = await DataService.iniciarSesion(email, a.password); await entrarConSesion(u); return; }
    if (a.pantalla === 'registro') {
      const r = await DataService.registrarse({ nombre: a.nombre.trim(), email, password: a.password });
      if (r.conSesion) { await entrarConSesion(r.usuario); return; }
      estado.auth = { ...AUTH_INICIAL, pantalla: 'login', email, mensaje: `Listo. Te enviamos un correo a ${email}: abre el enlace para confirmar tu cuenta y después inicia sesión. El jefe de ingeniería tendrá que aprobar tu acceso.` };
    }
    if (a.pantalla === 'recuperar') {
      await DataService.recuperarPassword(email);
      estado.auth = { ...AUTH_INICIAL, pantalla: 'login', email, mensaje: `Si existe una cuenta con ${email}, te llegará un correo con un enlace para crear una contraseña nueva. Revisa también la carpeta de spam.` };
    }
    if (a.pantalla === 'nueva_password') {
      const u = await DataService.cambiarPassword(a.password);
      agregarAviso('exito', 'Contraseña actualizada.');
      await entrarConSesion(u); return;
    }
  } catch (e) { estado.auth.error = e.message; }
  finally { estado.auth.enviando = false; render(); }
}

/* ---------- Tiempo real ---------- */
function suscribirCambios() {
  if (canal) SB.removeChannel(canal);
  canal = SB.channel('ing-cambios');
  for (const tabla of ['ing_sku_entregables', 'ing_skus', 'ing_familias', 'ing_entregables', 'ing_perfiles']) {
    canal.on('postgres_changes', { event: '*', schema: 'public', table: tabla }, () => programarRecarga());
  }
  canal.subscribe();
}
function programarRecarga(ms = 700) { conRetraso('recarga', recargarYRefrescar, ms); }
async function recargarYRefrescar() {
  if (estado.fase !== 'app') return;
  try { await DataService.recargarTodo(); } catch (e) { return; }
  const yo = cache.perfiles[estado.sesion.user_id];
  if (!yo || !yo.activo || !yo.rol_id) { const { data } = await SB.auth.getSession(); if (data.session) entrarConSesion(data.session.user); return; }
  if (Number(yo.rol_id) !== estado.sesion.rol_id) {
    estado.sesion.rol_id = Number(yo.rol_id); estado.sesion.rol_nombre = NOMBRES_ROL[yo.rol_id];
    agregarAviso('exito', `Tu rol cambió a ${estado.sesion.rol_nombre}.`);
  }
  await cargarCatalogos();
  refrescarVistas();
}
function refrescarVistas() {
  if (estado.vista === 'skus') cargarSkus({ silencioso: true });
  else if (estado.vista === 'tablero') cargarTablero({ silencioso: true });
  else if (estado.vista === 'historial') cargarHistorial({ silencioso: true });
  else if (estado.vista === 'admin' && puede(estado.sesion.rol_id, 'administrar')) recargarAdminSilencioso();
  if (estado.detalle.abierto) refrescarDetalleSi(estado.detalle.sku_id);
}

/* ---------- Avisos ---------- */
let siguienteAviso = 1;
function agregarAviso(tipo, texto) {
  const id = siguienteAviso++;
  estado.avisos.push({ id, tipo, texto }); render();
  setTimeout(() => cerrarAviso(id), tipo === 'error' ? 7000 : 4000);
}
function cerrarAviso(id) { estado.avisos = estado.avisos.filter(a => a.id !== id); render(); }

/* ---------- Navegación ---------- */
function irA(vista) { estado.vista = vista; estado.detalle.abierto = false; estado.modal = null; window.scrollTo(0, 0); cargarVista(); }
function cargarVista() {
  if (estado.vista === 'skus') cargarSkus();
  else if (estado.vista === 'tablero') cargarTablero();
  else if (estado.vista === 'historial') cargarHistorial();
  else if (estado.vista === 'admin') { if (puede(estado.sesion.rol_id, 'administrar')) cargarAdmin(); else render(); }
}
async function cargarCatalogos() {
  const [familias, entregables, estatus] = await Promise.all([
    DataService.listarFamilias({ incluir_inactivas: true }), DataService.listarEntregables({ incluir_inactivos: true }), DataService.listarEstatusSku()
  ]);
  estado.catalogos = { familias, entregables, estatus };
  estado.pendientes = Object.values(cache.perfiles).filter(p => !p.rol_id).length;
  render();
}

/* ---------- Avance por SKU ---------- */
async function cargarSkus({ silencioso = false } = {}) {
  if (!silencioso) { estado.skus.cargando = true; estado.skus.error = null; render(); }
  try { const r = await DataService.listarSkus(estado.skus.filtros); estado.skus.datos = r.skus; estado.skus.entregables = r.entregables; estado.skus.error = null; }
  catch (e) { estado.skus.error = e.message; }
  finally { estado.skus.cargando = false; render(); }
}
function cambiarFiltroSkus(campo, valor) {
  estado.skus.filtros[campo] = valor; render();
  if (campo === 'busqueda') conRetraso('skus', () => cargarSkus({ silencioso: true })); else cargarSkus({ silencioso: true });
}
function limpiarFiltrosSkus() { estado.skus.filtros = { ...FILTROS_SKUS_INICIALES }; cargarSkus({ silencioso: true }); }
function verSkusFiltrados(parcial) { estado.skus.filtros = { ...FILTROS_SKUS_INICIALES, ...parcial }; irA('skus'); }
function reemplazarSkuEnLista(sku) {
  if (estado.skus.datos) estado.skus.datos = estado.skus.datos.map(s => s.id === sku.id ? sku : s);
  if (estado.admin.skus) estado.admin.skus = estado.admin.skus.map(s => s.id === sku.id ? sku : s);
}
async function alternarCasilla(sku, casilla) {
  if (!puede(estado.sesion.rol_id, 'marcar') || estado.skus.celdaGuardando) return;
  if (casilla.completado) { abrirModalDesmarcar(sku, casilla); return; }
  estado.skus.celdaGuardando = `${sku.id}-${casilla.entregable_id}`; render();
  try {
    // NO IMPLEMENTADO: comentario opcional al marcar — la función ing_marcar lo acepta, pero se acordó marcar con un solo clic
    const actualizado = await DataService.marcarEntregable(sku.id, casilla.entregable_id);
    reemplazarSkuEnLista(actualizado);
    agregarAviso('exito', `Entregable marcado como correcto: ${casilla.nombre} en ${sku.clave}.`);
    refrescarDetalleSi(sku.id);
  } catch (e) {
    agregarAviso('error', `No se pudo marcar ${casilla.nombre} en ${sku.clave}. ${e.message}`);
    if (e.tipo === 'conflicto') programarRecarga(0);
  } finally { estado.skus.celdaGuardando = null; render(); }
}
function abrirModalDesmarcar(sku, casilla) {
  estado.modal = { tipo: 'desmarcar', sku_id: sku.id, sku_clave: sku.clave, entregable_id: casilla.entregable_id, entregable_nombre: casilla.nombre, marcado_por: casilla.completado_por_nombre, marcado_en: casilla.completado_en, causa: '', error: null, enviando: false };
  enfocarDespues = 'causa-desmarcar'; render();
}
async function confirmarDesmarcar() {
  const m = estado.modal;
  const err = validarCausa(m.causa);
  if (err) { m.error = err; enfocarDespues = 'causa-desmarcar'; render(); return; }
  m.enviando = true; m.error = null; render();
  try {
    const actualizado = await DataService.desmarcarEntregable(m.sku_id, m.entregable_id, m.causa);
    reemplazarSkuEnLista(actualizado);
    estado.modal = null;
    agregarAviso('exito', `Entregable desmarcado: ${m.entregable_nombre} en ${m.sku_clave}.`);
    refrescarDetalleSi(m.sku_id);
  } catch (e) {
    if (e.campos && e.campos.causa) m.error = e.campos.causa;

/* ---------- Exportar (respaldo en CSV para Excel) ---------- */
function descargarCsv(nombre, filas) {
  const celda = v => { let t = v === null || v === undefined ? '' : String(v); if (/^[=+\-@]/.test(t)) t = "'" + t; return /[",\n;]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const texto = '\uFEFF' + filas.map(f => f.map(celda).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

<!-- ===== 5. REGLAS DE NEGOCIO Y VALIDACIONES ===== -->
<script>
const ROLES = { INGENIERO: 1, JEFE: 2, CONSULTA: 3 };
const ESTATUS_SKU = { ACTIVO: 1, DESCONTINUADO: 2 };
const NOMBRES_ROL = { 1: 'Ingeniero', 2: 'Jefe de ingeniería', 3: 'Consulta' };

/* Quién puede hacer qué. ver: los tres roles; marcar/desmarcar: ingeniero y jefe; administrar: solo jefe. */
const PERMISOS = { ver: [ROLES.INGENIERO, ROLES.JEFE, ROLES.CONSULTA], marcar: [ROLES.INGENIERO, ROLES.JEFE], administrar: [ROLES.JEFE] };
function puede(rolId, accion) { return (PERMISOS[accion] || []).includes(rolId); }

const LIMITES = { imagenMaxMb: 10, causaMin: 10, causaMax: 255, claveMax: 30, descripcionMax: 150, observacionesMax: 1000, nombreCatalogoMax: 60 };

/* Al desmarcar, la causa es obligatoria y debe decir algo útil (mínimo 10 caracteres). */
function validarCausa(texto) {
  const t = String(texto || '').trim();
  if (!t) return 'Escribe la causa por la que desmarcas este entregable.';
  if (t.length < LIMITES.causaMin) return `Describe la causa con un poco más de detalle (mínimo ${LIMITES.causaMin} caracteres).`;
  if (t.length > LIMITES.causaMax) return `La causa no puede pasar de ${LIMITES.causaMax} caracteres.`;
  return null;
}

/* Imagen de referencia: JPG, PNG o WEBP de hasta 10 MB; se optimiza en el navegador antes de guardarse. */
const TIPOS_IMAGEN = ['image/jpeg', 'image/png', 'image/webp'];
function validarImagen({ type, size }) {
  if (!TIPOS_IMAGEN.includes(type)) return 'La imagen debe ser JPG, PNG o WEBP.';
  if (size > LIMITES.imagenMaxMb * 1024 * 1024) return `La imagen no puede pesar más de ${LIMITES.imagenMaxMb} MB.`;
  return null;
}

/* La clave se guarda en mayúsculas y sin espacios: "sil 12a" → "SIL12A". */
function normalizarClave(clave) { return String(clave || '').trim().toUpperCase().replace(/\s+/g, ''); }
function limpiarDatosSku(d) {
  return {
    clave: normalizarClave(d.clave), descripcion: String(d.descripcion || '').trim(),
    familia_id: d.familia_id ? Number(d.familia_id) : null, estatus_sku_id: d.estatus_sku_id ? Number(d.estatus_sku_id) : null,
    observaciones: String(d.observaciones || '').trim() || null
  };
}
function validarSku(d, skusExistentes, idActual) {
  const e = {};
  if (!d.clave) e.clave = 'Escribe el SKU.';
  else if (!/^[A-Z0-9][A-Z0-9-]*$/.test(d.clave)) e.clave = 'Usa solo letras, números y guiones (por ejemplo SIL-12A).';
  else if (d.clave.length > LIMITES.claveMax) e.clave = `El SKU no puede pasar de ${LIMITES.claveMax} caracteres.`;
  else if (skusExistentes.some(s => s.id !== idActual && normalizarClave(s.clave) === d.clave)) e.clave = `Ya existe el SKU ${d.clave}.`;
  if (!d.descripcion) e.descripcion = 'Escribe la descripción.';
  else if (d.descripcion.length > LIMITES.descripcionMax) e.descripcion = `La descripción no puede pasar de ${LIMITES.descripcionMax} caracteres.`;
  if (!d.familia_id) e.familia_id = 'Elige la familia.';
  if (!d.estatus_sku_id) e.estatus_sku_id = 'Elige el estatus.';
  if (d.observaciones && d.observaciones.length > LIMITES.observacionesMax) e.observaciones = `Las observaciones no pueden pasar de ${LIMITES.observacionesMax} caracteres.`;
  return Object.keys(e).length ? e : null;
}
function validarNombreCatalogo(nombre, existentes, idActual, entidad) {
  const n = String(nombre || '').trim();
  const art = entidad === 'familia' ? 'la familia' : 'el entregable';
  if (!n) return `Escribe el nombre de ${art}.`;
  if (n.length > LIMITES.nombreCatalogoMax) return `El nombre no puede pasar de ${LIMITES.nombreCatalogoMax} caracteres.`;
  if (existentes.some(x => x.id !== idActual && normalizarTexto(x.nombre) === normalizarTexto(n))) return `Ya existe ${entidad === 'familia' ? 'una familia' : 'un entregable'} con ese nombre.`;
  return null;
}
/* Formularios de acceso. Contraseñas de mínimo 8 caracteres (configura lo mismo en Supabase → Authentication). */
function validarFormularioAuth(pantalla, d) {
  const correoValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);
  if (pantalla === 'registro' && !d.nombre.trim()) return 'Escribe tu nombre completo.';
  if (pantalla !== 'nueva_password' && !correoValido) return 'Escribe un correo válido.';
  if (pantalla === 'recuperar') return null;
  if (!d.password) return 'Escribe tu contraseña.';
  if (pantalla !== 'login' && d.password.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
  if (pantalla !== 'login' && !(/[A-Za-z]/.test(d.password) && /\d/.test(d.password))) return 'La contraseña debe combinar letras y números.';
  if (pantalla !== 'login' && d.password !== d.confirmar) return 'Las contraseñas no coinciden.';
  return null;
}

/* Avance: completados ÷ entregables activos, redondeado a entero. Un SKU está completo solo al 100 %. */
function calcularPorcentaje(completados, total) { return total ? Math.round((completados * 100) / total) : 0; }
function estadoAvance(completados, total) {
  if (total > 0 && completados === total) return 'completo';
  if (completados === 0) return 'sin_iniciar';
  return 'en_proceso';
}
/* Orden natural: SIL-2 antes que SIL-10, y letras en orden alfabético sin importar mayúsculas ni acentos. */
function compararNatural(a, b) { return String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' }); }
function normalizarTexto(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
</script>

<!-- ===== 6. INTERFAZ (COMPONENTES) ===== -->
<script>
/* ---------- Utilidades de interfaz (no son componentes) ---------- */
function h(etiqueta, props, ...hijos) {
  const el = document.createElement(etiqueta);
  let valor;
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') valor = v;
    else if (k === 'checked') el.checked = true;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const hijo of hijos.flat(Infinity)) {
    if (hijo === null || hijo === undefined || hijo === false || hijo === '') continue;
    el.append(hijo instanceof Node ? hijo : document.createTextNode(String(hijo))); // textContent, nunca innerHTML
  }
  if (valor !== undefined) el.value = String(valor);
  return el;

      h('label', { for: 'causa-desmarcar', class: CLS.etiqueta }, 'Causa (obligatoria)'),
      h('textarea', { id: 'causa-desmarcar', rows: '4', maxlength: String(LIMITES.causaMax), class: m.error ? CLS.inputError : CLS.input, placeholder: 'Por ejemplo: el DXF no coincide con la cota del plano de ensamble.', 'aria-invalid': m.error ? 'true' : null, 'aria-describedby': 'causa-ayuda', disabled: m.enviando, value: m.causa, onInput: ev => { estado.modal.causa = ev.target.value; if (estado.modal.error) { estado.modal.error = null; render(); } } }),
      m.error ? ErrorCampo(m.error, 'causa-ayuda') : h('p', { id: 'causa-ayuda', class: 'mt-1 text-xs text-[#5B6675] dark:text-[#9AA7B6]' }, `Mínimo ${LIMITES.causaMin} caracteres. Escribe qué hay que corregir.`)),
    PieModal('Desmarcar entregable', confirmarDesmarcar, { peligro: true, enviando: m.enviando, textoEnviando: 'Desmarcando…' }));
}
/* FIN COMPONENTE: ModalDesmarcar */

/* COMPONENTE: ModalSku */
function ModalSku() {
  const m = estado.modal;
  const e = m.errores || {};
  const campo = (nombre, valor) => { estado.modal.datos[nombre] = valor; if (estado.modal.errores[nombre]) { delete estado.modal.errores[nombre]; render(); } };
  const familias = estado.catalogos.familias.filter(f => f.activa || String(f.id) === m.datos.familia_id);
  const grupo = (id, etiqueta, control, error) => h('div', null, h('label', { for: id, class: CLS.etiqueta }, etiqueta), control, ErrorCampo(error, `${id}-error`));
  return h('form', { novalidate: true, onSubmit: ev => { ev.preventDefault(); guardarSku(); } },
    h('h2', { id: 'titulo-modal', class: 'text-lg font-semibold' }, m.id ? `Editar SKU ${m.clave_original}` : 'Nuevo SKU'),
    m.id ? null : h('p', { class: 'mt-1 text-sm text-[#5B6675] dark:text-[#9AA7B6]' }, 'Se crearán sus casillas de entregables sin marcar. La imagen de referencia se sube desde el detalle del SKU.'),
    h('div', { class: 'mt-4 space-y-4' },
      grupo('sku-clave', 'SKU', h('input', { id: 'sku-clave', class: `${e.clave ? CLS.inputError : CLS.input} uppercase tabular-nums`, maxlength: String(LIMITES.claveMax), placeholder: 'Por ejemplo SIL-12A', 'aria-invalid': e.clave ? 'true' : null, value: m.datos.clave, onInput: ev => campo('clave', ev.target.value) }), e.clave),
      grupo('sku-descripcion', 'Descripción', h('input', { id: 'sku-descripcion', class: e.descripcion ? CLS.inputError : CLS.input, maxlength: String(LIMITES.descripcionMax), 'aria-invalid': e.descripcion ? 'true' : null, value: m.datos.descripcion, onInput: ev => campo('descripcion', ev.target.value) }), e.descripcion),
      h('div', { class: 'grid gap-4 sm:grid-cols-2' },
        grupo('sku-familia', 'Familia', h('select', { id: 'sku-familia', class: e.familia_id ? CLS.inputError : CLS.input, value: m.datos.familia_id, onChange: ev => campo('familia_id', ev.target.value) },
          h('option', { value: '' }, 'Elige una familia'), familias.map(f => h('option', { value: f.id }, f.nombre))), e.familia_id),
        grupo('sku-estatus', 'Estatus', h('select', { id: 'sku-estatus', class: e.estatus_sku_id ? CLS.inputError : CLS.input, value: m.datos.estatus_sku_id, onChange: ev => campo('estatus_sku_id', ev.target.value) },
          estado.catalogos.estatus.map(s => h('option', { value: s.id }, s.nombre))), e.estatus_sku_id)),
      grupo('sku-observaciones', 'Observaciones (opcional)', h('textarea', { id: 'sku-observaciones', rows: '3', class: e.observaciones ? CLS.inputError : CLS.input, maxlength: String(LIMITES.observacionesMax), value: m.datos.observaciones, onInput: ev => campo('observaciones', ev.target.value) }), e.observaciones)),
    ErrorModal(m.error),
    PieModal(m.id ? 'Guardar SKU' : 'Crear SKU', guardarSku, { enviando: m.enviando }));
}
/* FIN COMPONENTE: ModalSku */

/* COMPONENTE: ModalCatalogo */
function ModalCatalogo() {
  const m = estado.modal;
  const esFamilia = m.entidad === 'familia';
  const titulo = m.id ? `Editar ${esFamilia ? 'familia' : 'entregable'}` : esFamilia ? 'Nueva familia' : 'Nuevo entregable';
  return h('form', { novalidate: true, onSubmit: ev => { ev.preventDefault(); guardarCatalogo(); } },
    h('h2', { id: 'titulo-modal', class: 'text-lg font-semibold' }, titulo),
    !esFamilia && !m.id ? h('p', { class: 'mt-1 text-sm text-[#5B6675] dark:text-[#9AA7B6]' }, 'Aparecerá como columna nueva en la matriz, sin marcar en todos los SKUs.') : null,
    h('div', { class: 'mt-4' },
      h('label', { for: 'catalogo-nombre', class: CLS.etiqueta }, 'Nombre'),
      h('input', { id: 'catalogo-nombre', class: m.error ? CLS.inputError : CLS.input, maxlength: String(LIMITES.nombreCatalogoMax), value: m.nombre, onInput: ev => { estado.modal.nombre = ev.target.value; if (estado.modal.error) { estado.modal.error = null; render(); } } }),
      ErrorCampo(m.error, 'catalogo-error')),
    PieModal(m.id ? `Guardar ${esFamilia ? 'familia' : 'entregable'}` : `Crear ${esFamilia ? 'familia' : 'entregable'}`, guardarCatalogo, { enviando: m.enviando }));
}
/* FIN COMPONENTE: ModalCatalogo */


/* COMPONENTE: ModalAprobar */
function ModalAprobar() {
  const m = estado.modal;
  const descripciones = { 1: 'Marca y desmarca entregables de cualquier SKU y sube imágenes.', 2: 'Todo lo del ingeniero, más alta de SKUs, catálogos y aprobación de usuarios.', 3: 'Ve avance, tablero e historial sin modificar nada.' };
  return h('form', { novalidate: true, onSubmit: ev => { ev.preventDefault(); guardarAprobacion(); } },
    h('h2', { id: 'titulo-modal', class: 'text-lg font-semibold' }, `Aprobar a ${m.nombre}`),
    h('p', { class: 'mt-1 text-sm text-[#5B6675] dark:text-[#9AA7B6]' }, `Confirma que ${m.email} es de alguien de tu equipo antes de darle acceso.`),
    h('div', { class: 'mt-4' },
      h('label', { for: 'aprobar-rol', class: CLS.etiqueta }, 'Rol'),
      h('select', { id: 'aprobar-rol', class: CLS.input, value: m.rol_id, onChange: ev => { estado.modal.rol_id = ev.target.value; render(); } },
        [ROLES.INGENIERO, ROLES.JEFE, ROLES.CONSULTA].map(r => h('option', { value: r }, NOMBRES_ROL[r]))),
      h('p', { class: 'mt-1 text-xs text-[#5B6675] dark:text-[#9AA7B6]' }, descripciones[m.rol_id])),
    ErrorModal(m.error),
    PieModal('Dar acceso', guardarAprobacion, { enviando: m.enviando }));
}
/* FIN COMPONENTE: ModalAprobar */

/* COMPONENTE: ModalConfirmacion */
function ModalConfirmacion() {
  const m = estado.modal;
  return h('div', null,
    h('h2', { id: 'titulo-modal', class: 'text-lg font-semibold' }, m.titulo),
    h('p', { class: 'mt-2 text-sm text-[#1B2430] dark:text-[#E6EAEF]' }, m.mensaje),
    ErrorModal(m.error),
    PieModal(m.textoBoton, ejecutarConfirmacion, { peligro: m.peligro, enviando: m.enviando, textoEnviando: 'Procesando…' }));
}
/* FIN COMPONENTE: ModalConfirmacion */

/* COMPONENTE: Avisos */
function Avisos() {
  return h('div', { class: 'pointer-events-none fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] right-4 z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2', 'aria-live': 'polite' },
    estado.avisos.map(a => h('div', {
      class: `pointer-events-auto flex items-start gap-2 rounded-md border border-[#D5DBE2] dark:border-[#2E3A48] border-l-4 bg-white dark:bg-[#18202A] px-4 py-3 text-sm shadow-md ${a.tipo === 'error' ? 'border-l-[#B42318] dark:border-l-[#F28B82]' : 'border-l-[#1F7A4D] dark:border-l-[#5CC48E]'}`,
      role: a.tipo === 'error' ? 'alert' : 'status'
    },
      h('span', { class: a.tipo === 'error' ? 'text-[#B42318] dark:text-[#F28B82]' : 'text-[#1F7A4D] dark:text-[#5CC48E]' }, icono(a.tipo === 'error' ? 'alerta' : 'check', 'w-4 h-4 mt-0.5')),
      h('p', { class: 'flex-1' }, a.texto),
      h('button', { type: 'button', class: 'rounded p-0.5 text-[#5B6675] dark:text-[#9AA7B6] hover:bg-[#F4F6F8] dark:hover:bg-[#243040] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#1E4E79] dark:focus-visible:ring-[#7FB2E5]', 'aria-label': 'Cerrar aviso', onClick: () => cerrarAviso(a.id) }, icono('x', 'w-4 h-4')))));
}
/* FIN COMPONENTE: Avisos */

/* COMPONENTE: App (raíz) */
function App() {
  if (estado.fase === 'auth') return h('div', null, FormularioAuth(), Avisos());
  if (estado.fase !== 'app' || !estado.sesion) return h('div', null, PantallaInicio(), Avisos());
  const vistas = { skus: VistaSkus, tablero: VistaTablero, historial: VistaHistorial, admin: VistaAdministracion };
  return h('div', { class: 'flex min-h-screen flex-col' },
    BarraSuperior(),
    h('main', { class: 'mx-auto w-full max-w-[1400px] flex-1 px-4 py-6 sm:px-6' }, vistas[estado.vista]()),
    estado.detalle.abierto ? PanelDetalleSku() : null,
    Modal(),
    Avisos());
}
/* FIN COMPONENTE: App */

/* ---------- Dibujo (en React esto lo hace el propio React) ---------- */
let graficas = [];
let enfocarDespues = null;
function render() {
  const activo = document.activeElement;
  const idFoco = activo && activo.id ? activo.id : null;
  let seleccion = null;
  try { if (idFoco && typeof activo.selectionStart === 'number') seleccion = [activo.selectionStart, activo.selectionEnd]; } catch (e) { /* inputs sin selección */ }
  const scrolls = {};
  document.querySelectorAll('[data-scroll-id]').forEach(el => { scrolls[el.dataset.scrollId] = [el.scrollLeft, el.scrollTop]; });
  graficas.forEach(g => g.destroy()); graficas = [];
  const oscuro = estado.tema === 'oscuro';
  document.documentElement.classList.toggle('dark', oscuro);
  document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
  document.getElementById('app').replaceChildren(App());
  document.querySelectorAll('[data-scroll-id]').forEach(el => { const s = scrolls[el.dataset.scrollId]; if (s) { el.scrollLeft = s[0]; el.scrollTop = s[1]; } });
  const objetivo = enfocarDespues || idFoco; enfocarDespues = null;
  if (objetivo) {
    const el = document.getElementById(objetivo);
    if (el && !el.disabled) { el.focus({ preventScroll: true }); if (seleccion && objetivo === idFoco) { try { el.setSelectionRange(seleccion[0], seleccion[1]); } catch (e) { /* select/checkbox */ } } }
  }
  montarGraficas();
}
function montarGraficas() {
  if (estado.fase !== 'app' || !estado.sesion || estado.vista !== 'tablero' || !estado.tablero.datos || typeof Chart === 'undefined') return;
  const d = estado.tablero.datos;
  const oscuro = estado.tema === 'oscuro';
  const C = oscuro
    ? { superficie: '#18202A', exito: '#2E9A63', ambar: '#D9A03A', gris: '#4A5663', barra: '#4F8BC4', texto: '#E6EAEF', suave: '#9AA7B6', rejilla: '#26313D' }
    : { superficie: '#FFFFFF', exito: '#1F7A4D', ambar: '#C98A1B', gris: '#B8C1CB', barra: '#1E4E79', texto: '#1B2430', suave: '#5B6675', rejilla: '#E3E7EC' };
  Chart.defaults.color = C.suave;
  const global = document.getElementById('grafica-global');
  if (global) graficas.push(new Chart(global, {
    type: 'doughnut',
    data: { labels: ['Completos', 'En proceso', 'Sin iniciar'], datasets: [{ data: [d.completos, d.en_proceso, d.sin_iniciar], backgroundColor: [C.exito, C.ambar, C.gris], borderColor: C.superficie, borderWidth: 2 }] },
    options: { cutout: '72%', maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw} SKUs` } } } }
  }));
  const barras = document.getElementById('grafica-entregables');
  if (barras) graficas.push(new Chart(barras, {
    type: 'bar',
    data: { labels: d.por_entregable.map(e => e.nombre), datasets: [{ data: d.por_entregable.map(e => e.porcentaje), backgroundColor: d.por_entregable.map(e => e.porcentaje === 100 ? C.exito : C.barra), borderRadius: 3, barThickness: 22 }] },
    options: {
      indexAxis: 'y', maintainAspectRatio: false, animation: false,
      scales: { x: { min: 0, max: 100, ticks: { callback: v => `${v}%`, color: C.suave }, grid: { color: C.rejilla } }, y: { ticks: { color: C.texto }, grid: { display: false } } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.raw}% (${d.por_entregable[ctx.dataIndex].completos} de ${d.total} SKUs)` } } },
      onClick: (ev, els) => { if (els.length) { const e = d.por_entregable[els[0].index]; setTimeout(() => verSkusFiltrados({ pendiente_entregable_id: String(e.id) }), 0); } }
    }
  }));
}
</script>

<!-- ===== 7. ARRANQUE ===== -->
<script>
if (typeof Chart !== 'undefined') { Chart.defaults.font.family = '"IBM Plex Sans", system-ui, sans-serif'; Chart.defaults.font.size = 12; }
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (estado.modal) cerrarModal();
  else if (estado.detalle.abierto) cerrarDetalle();
});
render();
arrancar();
</script>
