document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4e38962d-6163-40ba-a3ff-a2f8873bb303\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n\n<helmet>\n\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<title>Generador de Instructivos<\u002Ftitle>\n<style>\n  body { margin: 0; font-family: Arial, sans-serif; }\n  @media print { .no-print { display: none !important; } .page-zoom { zoom: 1 !important; } }\n  @media print { .print-only { display: block !important; } }\n  @media print { .app-shell, .app-scroll { display: block !important; height: auto !important; overflow: visible !important; background: none !important; } }\n  .app-shell { --ui-bg:#E9ECEE;--ui-panel:#FAFBFB;--ui-subtle:#F4F5F6;--ui-surface:#FFFFFF;--ui-line:#E3E6E8;--ui-line-strong:#C6CBCE;--ui-ink:#1C2D3C;--ui-text:#231F20;--ui-muted:#6D6E71;--ui-faint:#9AA0A3;--ui-hover:#EEF1F2;--ui-sel:#E3E9EB;--ui-accent:#0D5063;--ui-accent-bg:#0D5063;--ui-strong:#1C2D3C;--ui-danger:#B3413A;--ui-warn:#A86A0C;--ui-bar:#1C2D3C;--brand-dark:var(--ui-ink);--brand-accent:var(--ui-accent);color-scheme:light;font-family:\"Segoe UI\",system-ui,-apple-system,\"Helvetica Neue\",Arial,sans-serif;background:var(--ui-bg);color:var(--ui-text); }\n  .app-shell[data-theme=\"dark\"] { --ui-bg:#0E1317;--ui-panel:#151B20;--ui-subtle:#192026;--ui-surface:#1F272E;--ui-line:#29333B;--ui-line-strong:#39454F;--ui-ink:#E3E8EB;--ui-text:#D2D9DE;--ui-muted:#9AA6AE;--ui-faint:#75828B;--ui-hover:#232D35;--ui-sel:#24343E;--ui-accent:#6CBACD;--ui-accent-bg:#1A6578;--ui-strong:#2C6C7D;--ui-danger:#EA877E;--ui-warn:#E2AA4C;--ui-bar:#0A0F12;color-scheme:dark; }\n  .page-zoom { --ui-bg:#E9ECEE;--ui-panel:#FAFBFB;--ui-subtle:#F4F5F6;--ui-surface:#FFFFFF;--ui-line:#E3E6E8;--ui-line-strong:#C6CBCE;--ui-ink:#1C2D3C;--ui-text:#231F20;--ui-muted:#6D6E71;--ui-faint:#9AA0A3;--ui-hover:#EEF1F2;--ui-sel:#E3E9EB;--ui-accent:#0D5063;--ui-accent-bg:#0D5063;--ui-strong:#1C2D3C;--ui-danger:#B3413A;--ui-warn:#A86A0C;--brand-dark:var(--tpl-dark,#1C2D3C);--brand-accent:var(--tpl-accent,#0D5063);--brand-font:var(--tpl-font,Arial);color-scheme:light;font-family:var(--brand-font,Arial);color:#231F20; }\n  .app-shell[data-theme=\"dark\"] doc-page { background: #0E1317; }\n  .field-input { border: none; border-bottom: 1.5px solid var(--ui-line-strong); background: transparent; font-family: inherit; color: var(--ui-ink); padding: 2px 0; outline: none; }\n  .field-input:focus { border-bottom-color: var(--ui-accent); }\n  .icon-btn { border: 1px solid var(--ui-line-strong); background: var(--ui-surface); color: var(--ui-muted); border-radius: 6px; cursor: pointer; font-size: 12px; padding: 4px 8px; font-family: inherit; transition: border-color .12s, color .12s, background-color .12s; }\n  .icon-btn:hover { border-color: var(--ui-accent); color: var(--ui-accent); }\n  .tb-btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: rgba(255,255,255,.85); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; position: relative; white-space: nowrap; transition: background-color .12s, color .12s; }\n  .tb-btn:hover { background: rgba(255,255,255,.10); color: #fff; }\n  .tb-primary { background: #fff; color: #10202C; }\n  .tb-primary:hover { background: #DCE8EC; color: #10202C; }\n  .tb-sep { width: 1px; height: 22px; background: rgba(255,255,255,.14); margin: 0 4px; }\n  .menu-item { box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; text-align: left; background: transparent; border: none; border-radius: 6px; padding: 7px 10px; font-family: inherit; font-size: 12.5px; color: var(--ui-ink); cursor: pointer; }\n  .menu-item:hover { background: var(--ui-hover); }\n  .side-item:hover { background: var(--ui-hover) !important; }\n  .editor-sel { outline: 2px solid #1E63C4; outline-offset: -2px; }\n  .app-shell ::-webkit-scrollbar { width: 10px; height: 10px; }\n  .app-shell ::-webkit-scrollbar-thumb { background: var(--ui-line-strong); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }\n  .app-shell ::-webkit-scrollbar-track { background: transparent; }\n  @media print { .editor-sel { outline: none !important; } }\n<\u002Fstyle>\n<script src=\"636651a2-f894-4c36-b805-43485008ca47\"><\u002Fscript>\n<script src=\"ed7949bb-0edd-4fe7-808d-73a5fb56eb12\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div class=\"app-shell\" data-theme=\"{{ uiTheme }}\" style=\"display:flex;flex-direction:column;height:100vh\">\n\n  <sc-if value=\"{{ hasAutosave }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"no-print\" style=\"background:var(--ui-accent-bg,#0D5063);color:#fff;padding:8px 24px;display:flex;align-items:center;gap:12px;font-size:13px\">\n      <span>{{ autosaveMsg }}<\u002Fspan>\n      <button class=\"icon-btn\" style=\"background:var(--ui-surface,#fff)\" sc-camel-on-click=\"{{ onRestoreAutosave }}\">Recuperar<\u002Fbutton>\n      <button class=\"icon-btn\" style=\"background:transparent;color:#fff;border-color:rgba(255,255,255,.5)\" sc-camel-on-click=\"{{ onDismissAutosave }}\">Descartar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showReview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"no-print\" style=\"position:fixed;inset:0;background:rgba(8,14,19,.55);display:flex;align-items:center;justify-content:center;z-index:1000\">\n      <div style=\"background:var(--ui-surface);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:12px;padding:20px 22px;max-width:92vw;max-height:84vh;box-shadow:0 18px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;box-sizing:border-box;overflow-x:hidden;width:560px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n          <div style=\"font-size:16px;font-weight:700;color:var(--ui-ink)\">Revisión antes del PDF<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--ui-muted)\">{{ reviewSummary }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--ui-muted)\">Haz clic en un punto para ir a esa hoja.<\u002Fdiv>\n        <div style=\"overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0;border-top:1px solid var(--ui-line);padding-top:10px\">\n          <sc-if value=\"{{ hasReviewErrors }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:1px\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ui-danger);margin:0 0 4px 8px\">Errores · {{ reviewErrCount }}<\u002Fdiv>\n              <sc-for list=\"{{ reviewErrors }}\" as=\"iss\" hint-placeholder-count=\"0\">\n                <button class=\"menu-item\" style=\"display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:transparent;border:none;padding:7px 8px;border-radius:6px;font-family:inherit;font-size:12.5px;line-height:1.4;color:var(--ui-text);cursor:pointer\" sc-camel-on-click=\"{{ iss.onGo }}\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--ui-danger);flex:none;margin-top:5px\"><\u002Fspan><span style=\"flex:1;text-wrap:pretty\">{{ iss.text }}<\u002Fspan><span style=\"color:var(--ui-faint);font-size:11px;white-space:nowrap\">{{ iss.pageLabel }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasReviewWarns }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:1px\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ui-warn);margin:0 0 4px 8px\">Avisos · {{ reviewWarnCount }}<\u002Fdiv>\n              <sc-for list=\"{{ reviewWarns }}\" as=\"iss\" hint-placeholder-count=\"0\">\n                <button class=\"menu-item\" style=\"display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:transparent;border:none;padding:7px 8px;border-radius:6px;font-family:inherit;font-size:12.5px;line-height:1.4;color:var(--ui-text);cursor:pointer\" sc-camel-on-click=\"{{ iss.onGo }}\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--ui-warn);flex:none;margin-top:5px\"><\u002Fspan><span style=\"flex:1;text-wrap:pretty\">{{ iss.text }}<\u002Fspan><span style=\"color:var(--ui-faint);font-size:11px;white-space:nowrap\">{{ iss.pageLabel }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--ui-line);padding-top:12px\">\n          <button class=\"icon-btn\" style=\"padding:7px 14px;font-size:12px\" sc-camel-on-click=\"{{ onReviewCancel }}\">Volver a editar<\u002Fbutton>\n          <button class=\"icon-btn\" style=\"background:var(--ui-strong);color:#fff;border-color:transparent;padding:7px 14px;font-size:12px\" sc-camel-on-click=\"{{ onReviewPrint }}\">{{ reviewPrintLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showExceedPopup }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"no-print\" style=\"position:fixed;inset:0;background:rgba(28,45,60,.45);display:flex;align-items:center;justify-content:center;z-index:1000\">\n      <div style=\"background:var(--ui-surface,#fff);border-radius:10px;padding:22px 24px;width:360px;max-width:90vw;box-shadow:0 12px 32px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--ui-danger,#B3413A)\">\n        <div style=\"font-size:15px;font-weight:800;color:var(--ui-danger,#B3413A)\">⚠ Cantidad de piezas excedida<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--ui-text,#231F20);line-height:1.4;text-wrap:pretty\">{{ exceedsTotalMsg }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n          <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-muted,#6D6E71);cursor:pointer\">\n            <input type=\"checkbox\" default-checked=\"{{ suppressExceedChecked }}\" sc-camel-on-change=\"{{ onToggleSuppressExceed }}\">\n            No volver a mostrar\n          <\u002Flabel>\n          <button class=\"icon-btn\" style=\"background:var(--ui-strong,#1C2D3C);color:#fff;border-color:var(--ui-ink,#1C2D3C);padding:6px 16px;font-size:12px\" sc-camel-on-click=\"{{ onCloseExceedPopup }}\">Entendido<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div class=\"no-print\" style=\"background:var(--ui-bar);color:#fff;display:flex;align-items:center;gap:4px;padding:8px 14px;flex-wrap:wrap;position:relative;z-index:50\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin-right:8px;min-width:0\">\n      <div style=\"width:30px;height:30px;border-radius:7px;background:var(--ui-accent-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.03em;flex:none\">GI<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;line-height:1.25;min-width:0\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:.01em\">Generador de Instructivos<\u002Fspan>\n        <span style=\"font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px\">{{ docTitle }} · {{ pageCount }} págs. · Rev. {{ revisionOrOne }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tb-sep\"><\u002Fdiv>\n    <button class=\"tb-btn\" sc-camel-on-click=\"{{ newFile }}\" title=\"Nuevo archivo en blanco (Ctrl+N)\">Nuevo<\u002Fbutton>\n    <button class=\"tb-btn\" sc-camel-on-click=\"{{ loadProjectPicker }}\" style=\"display:{{ hasFilePicker }}\" title=\"Abrir un instructivo .json\">Abrir<\u002Fbutton>\n    <label class=\"tb-btn\" style=\"display:{{ noFilePicker }}\" title=\"Abrir un instructivo .json\">\n      Abrir\n      <input type=\"file\" accept=\"application/json,.json\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer\" sc-camel-on-change=\"{{ loadProject }}\">\n    <\u002Flabel>\n    <button class=\"tb-btn\" sc-camel-on-click=\"{{ saveProject }}\" title=\"Guardar (Ctrl+S)\">Guardar<\u002Fbutton>\n    <button class=\"tb-btn\" sc-camel-on-click=\"{{ saveProjectAs }}\" title=\"Guardar como (Ctrl+Shift+S)\">Guardar como<\u002Fbutton>\n    <label class=\"tb-btn\" title=\"Crea un instructivo a partir de un PowerPoint (.pptx)\">\n      {{ importPptxLabel }}\n      <input type=\"file\" accept=\".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer\" sc-camel-on-change=\"{{ importPptx }}\">\n    <\u002Flabel>\n    <div style=\"position:relative\">\n      <button class=\"tb-btn\" sc-camel-on-click=\"{{ onToggleMore }}\">Más ▾<\u002Fbutton>\n      <sc-if value=\"{{ moreOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:fixed;inset:0;z-index:60\" sc-camel-on-mouse-down=\"{{ onCloseMore }}\"><\u002Fdiv>\n        <div style=\"position:absolute;top:calc(100% + 6px);left:0;z-index:61;min-width:270px;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:9px;box-shadow:0 14px 34px rgba(0,0,0,.3);padding:5px;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ moreItems }}\" as=\"mi\" hint-placeholder-count=\"0\">\n            <button class=\"menu-item\" style=\"{{ mi.style }}\" sc-camel-on-click=\"{{ mi.onClick }}\"><span>{{ mi.label }}<\u002Fspan><span style=\"color:var(--ui-faint);font-size:11px\">{{ mi.hint }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <button class=\"tb-btn\" sc-camel-on-click=\"{{ onOpenSearch }}\" title=\"Buscar piezas, herrajes y textos (Ctrl+F)\">Buscar<\u002Fbutton>\n    <button class=\"tb-btn\" sc-camel-on-click=\"{{ onOpenHelp }}\" title=\"Tutorial breve (F1)\">Cómo funciona<\u002Fbutton>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <button class=\"tb-btn\" style=\"{{ autosaveChipStyle }}\" sc-camel-on-click=\"{{ onAutosaveChip }}\" title=\"{{ autosaveTitle }}\">{{ autosaveLabel }}<\u002Fbutton>\n    <button class=\"tb-btn\" sc-camel-on-click=\"{{ onToggleTheme }}\" title=\"Cambiar apariencia de la aplicación (no afecta al PDF)\">{{ themeLabel }}<\u002Fbutton>\n    <button class=\"tb-btn tb-primary\" sc-camel-on-click=\"{{ printDoc }}\" title=\"Revisar y generar PDF (Ctrl+P)\">Generar PDF<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"no-print\" style=\"background:var(--ui-panel);border-bottom:1px solid var(--ui-line);padding:8px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n    <label style=\"display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ui-muted);font-weight:600\">\n      Producto\n      <textarea class=\"field-input\" rows=\"2\" style=\"width:220px;font-size:13px;font-weight:700;resize:vertical;font-family:inherit;line-height:1.3\" placeholder=\"Nombre del mueble (Enter para salto de línea)\" value=\"{{ furnitureName }}\" sc-camel-on-change=\"{{ onFurnitureNameChange }}\"><\u002Ftextarea>\n    <\u002Flabel>\n    <label style=\"display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ui-muted);font-weight:600\">\n      SKU\n      <input class=\"field-input\" style=\"width:110px;font-size:13px;font-weight:700\" placeholder=\"2208\" value=\"{{ code }}\" sc-camel-on-change=\"{{ onCodeChange }}\">\n    <\u002Flabel>\n    <div style=\"display:f 0px;padding:2px 8px\" sc-camel-on-click=\"{{ activeExtraControls.onPanUp }}\">▲<\u002Fbutton>\n            <span><\u002Fspan>\n            <button class=\"icon-btn\" style=\"font-size:10px;padding:2px 8px\" sc-camel-on-click=\"{{ activeExtraControls.onPanLeft }}\">◀<\u002Fbutton>\n            <span><\u002Fspan>\n            <button class=\"icon-btn\" style=\"font-size:10px;padding:2px 8px\" sc-camel-on-click=\"{{ activeExtraControls.onPanRight }}\">▶<\u002Fbutton>\n            <span><\u002Fspan>\n            <button class=\"icon-btn\" style=\"font-size:10px;padding:2px 8px\" sc-camel-on-click=\"{{ activeExtraControls.onPanDown }}\">▼<\u002Fbutton>\n            <span><\u002Fspan>\n          <\u002Fdiv>\n          <button class=\"icon-btn\" style=\"font-size:10px;padding:4px 0;width:100%;margin-bottom:6px;background:var(--ui-accent-bg,#0D5063);color:#fff;border-color:var(--ui-accent,#0D5063)\" title=\"Elimina automáticamente los márgenes vacíos/blancos alrededor de la imagen\" sc-camel-on-click=\"{{ activeExtraControls.onAutoCrop }}\">✂ Recortar márgenes vacíos<\u002Fbutton>\n          <label style=\"display:block;font-size:9.5px;color:var(--ui-muted,#6D6E71);margin-bottom:2px\">Pie de imagen<\u002Flabel>\n          <input class=\"field-input\" style=\"width:100%;font-size:10.5px;margin-bottom:8px\" placeholder=\"Ej. ARCHIVERO LADO IZQUIERDO\" value=\"{{ activeExtraControls.captionValue }}\" sc-camel-on-change=\"{{ activeExtraControls.onCaptionChange }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:6px\">\n            <button class=\"icon-btn\" style=\"font-size:10px;padding:3px 0\" sc-camel-on-click=\"{{ activeExtraControls.onCopy }}\">Copiar<\u002Fbutton>\n            <button class=\"icon-btn\" style=\"font-size:10px;padding:3px 0\" sc-camel-on-click=\"{{ activeExtraControls.onCut }}\">Cortar<\u002Fbutton>\n          <\u002Fdiv>\n          <button class=\"icon-btn\" style=\"font-size:10px;padding:3px 0;width:100%\" sc-camel-on-click=\"{{ activeExtraControls.onResetCrop }}\">Restablecer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<sc-if value=\"{{ showRevLog }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;inset:0;background:rgba(8,14,19,.55);display:flex;align-items:center;justify-content:center;z-index:1000\" sc-camel-on-mouse-down=\"{{ onBackdropRevLog }}\">\n    <div style=\"background:var(--ui-surface);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:12px;padding:20px 22px;max-width:92vw;max-height:84vh;box-shadow:0 18px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;box-sizing:border-box;overflow-x:hidden;width:620px\" sc-camel-on-mouse-down=\"{{ stopEvt }}\">\n      <div style=\"font-size:16px;font-weight:700;color:var(--ui-ink)\">Bitácora de revisiones<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--ui-muted);line-height:1.45;text-wrap:pretty\">Ctrl+S siempre guarda sobre el mismo archivo. Cuando cambias el número de revisión (aquí o en el campo Rev.), al guardar se te pregunta si crear un archivo nuevo para esa revisión o sobrescribir el original.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:52px 140px minmax(0,1fr) 30px;gap:6px 10px;align-items:center;overflow-y:auto;min-height:0;border-top:1px solid var(--ui-line);padding-top:10px\">\n        <div style=\"font-size:10.5px;font-weight:700;color:var(--ui-faint);letter-spacing:.06em\">REV.<\u002Fdiv>\n        <div style=\"font-size:10.5px;font-weight:700;color:var(--ui-faint);letter-spacing:.06em\">FECHA<\u002Fdiv>\n        <div style=\"font-size:10.5px;font-weight:700;color:var(--ui-faint);letter-spacing:.06em\">MOTIVO<\u002Fdiv>\n        <div><\u002Fdiv>\n        <sc-for list=\"{{ revLogRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n          <div style=\"display:contents\">\n            <div style=\"font-size:13px;font-weight:700;color:var(--ui-ink)\">{{ r.rev }}<\u002Fdiv>\n            <input class=\"field-input\" type=\"date\" style=\"font-size:12.5px\" value=\"{{ r.date }}\" sc-camel-on-change=\"{{ r.onDate }}\">\n            <input class=\"field-input\" style=\"font-size:12.5px;width:100%\" placeholder=\"Describe el cambio\" value=\"{{ r.reason }}\" sc-camel-on-change=\"{{ r.onReason }}\">\n            <button class=\"icon-btn\" style=\"padding:2px 6px;font-size:10px\" title=\"Eliminar entrada\" sc-camel-on-click=\"{{ r.onRemove }}\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ revLogEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;color:var(--ui-faint)\">Aún no hay revisiones. Se creará la primera al guardar.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:center;gap:8px;border-top:1px solid var(--ui-line);padding-top:12px;flex-wrap:wrap\">\n        <div style=\"font-size:11.5px;color:var(--ui-faint);margin-right:auto\">Solo para consulta interna; no se imprime en el PDF.<\u002Fdiv>\n        <button class=\"icon-btn\" style=\"padding:7px 12px\" sc-camel-on-click=\"{{ onBumpRev }}\">+ Nueva revisión<\u002Fbutton>\n        <button class=\"icon-btn\" style=\"padding:7px 14px;background:var(--ui-strong);color:#fff;border-color:transparent\" sc-camel-on-click=\"{{ onCloseRevLog }}\">Listo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showVersions }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;inset:0;background:rgba(8,14,19,.55);display:flex;align-items:center;justify-content:center;z-index:1000\" sc-camel-on-mouse-down=\"{{ onCloseVersions }}\">\n    <div style=\"background:var(--ui-surface);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:12px;padding:20px 22px;max-width:92vw;max-height:84vh;box-shadow:0 18px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;box-sizing:border-box;overflow-x:hidden;width:540px\" sc-camel-on-mouse-down=\"{{ stopEvt }}\">\n      <div style=\"font-size:16px;font-weight:700;color:var(--ui-ink)\">Versiones anteriores<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--ui-muted);line-height:1.45;text-wrap:pretty\">Antes de sobrescribir el archivo se guarda aquí la versión previa (las últimas 8 de este instructivo, en este navegador).<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0;border-top:1px solid var(--ui-line);padding-top:8px\">\n        <sc-for list=\"{{ versionRows }}\" as=\"v\" hint-placeholder-count=\"0\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;border-bottom:1px solid var(--ui-line)\">\n            <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:12.5px;font-weight:600;color:var(--ui-ink)\">{{ v.when }}<\u002Fspan><span style=\"font-size:11px;color:var(--ui-faint)\">{{ v.size }}<\u002Fspan><\u002Fdiv>\n            <button class=\"icon-btn\" style=\"padding:4px 10px\" sc-camel-on-click=\"{{ v.onDownload }}\">Descargar<\u002Fbutton>\n            <button class=\"icon-btn\" style=\"padding:4px 10px\" sc-camel-on-click=\"{{ v.onRestore }}\">Restaurar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ versionsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px;color:var(--ui-faint);padding:6px 8px\">Todavía no hay versiones anteriores. Se crean a partir del segundo guardado.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--ui-line);padding-top:12px\">\n        <button class=\"icon-btn\" style=\"padding:7px 12px\" sc-camel-on-click=\"{{ onSaveDatedCopy }}\">Guardar copia con fecha<\u002Fbutton>\n        <button class=\"icon-btn\" style=\"padding:7px 14px;background:var(--ui-strong);color:#fff;border-color:transparent\" sc-camel-on-click=\"{{ onCloseVersions }}\">Cerrar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showBrand }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;inset:0;background:rgba(8,14,19,.55);display:flex;align-items:center;justify-content:center;z-index:1000\" sc-camel-on-mouse-down=\"{{ onCloseBrand }}\">\n    <div style=\"background:var(--ui-surface);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:12px;padding:20px 22px;max-width:92vw;max-height:84vh;box-shadow:0 18px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;box-sizing:border-box;overflow-x:hidden;width:640px;overflow-y:auto\" sc-camel-on-mouse-down=\"{{ stopEvt }}\">\n      <div style=\"font-size:16px;font-weight:700;color:var(--ui-ink)\">Diseño y marca<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--ui-muted);line-height:1.45;text-wrap:pretty\">Se aplica a todas las hojas del instructivo y queda como diseño predeterminado para los nuevos instructivos en este navegador.<\u002Fdiv>\n      <div style=\"border:1px solid var(--ui-line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n          <div style=\"font-size:12.5px;font-weight:700;color:var(--ui-ink);margin-right:auto\">Plantilla de diseño <span style=\"font-weight:400;color:var(--ui-faint)\">· {{ designName }}<\u002Fspan><\u002Fdiv>\n          <label class=\"icon-btn\" style=\"position:relative;padding:6px 11px\">Cargar plantilla PowerPoint<input type=\"file\" accept=\".pptx,.potx,.thmx,.ppsx\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer\" sc-camel-on-change=\"{{ onLoadTemplate }}\"><\u002Flabel>\n          <button class=\"icon-btn\" style=\"padding:6px 11px\" sc-camel-on-click=\"{{ onResetDesign }}\">Restablecer original<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--ui-muted);line-height:1.45;text-wrap:pretty\">Toma los colores y la tipografía del tema de un .pptx, .potx o .thmx. Si el color de la plantilla es muy claro para texto blanco, se oscurece automáticamente.<\u002Fdiv>\n        <div style=\"display:flex;gap:18px;flex-wrap:wrap;align-items:center\">\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ui-text)\"><input type=\"color\" value=\"{{ designDark }}\" sc-camel-on-change=\"{{ onDesignDark }}\" style=\"width:34px;height:26px;border:1px solid var(--ui-line-strong);border-radius:5px;padding:1px;background:var(--ui-surface)\">Color principal (banners)<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ui-text)\"><input type=\"color\" value=\"{{ designAccent }}\" sc-camel-on-change=\"{{ onDesignAccent }}\" style=\"width:34px;height:26px;border:1px solid var(--ui-line-strong);border-radius:5px;padding:1px;background:var(--ui-surface)\">Color de acento<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ui-text)\">Tipografía<input class=\"field-input\" style=\"width:150px;font-size:12.5px\" placeholder=\"Arial\" value=\"{{ designFont }}\" sc-camel-on-change=\"{{ onDesignFont }}\"><\u002Flabel>\n        <\u002Fdiv>\n        <sc-if value=\"{{ tplLogoAvailable }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ui-text)\"><img ref=\"{{ tplLogoRef }}\" alt=\"\" style=\"height:30px;max-width:120px;object-fit:contain;background:var(--ui-surface,#fff);border:1px solid var(--ui-line);border-radius:4px;padding:2px\">La plantilla trae una imagen en el patrón.<button class=\"icon-btn\" style=\"padding:4px 10px\" sc-camel-on-click=\"{{ onUseTplLogo }}\">Usarla como logo de portada<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--ui-line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\">\n        <div style=\"font-size:12.5px;font-weight:700;color:var(--ui-ink);margin-bottom:4px\">Elementos fijos de la portada y banners<\u002Fdiv>\n        <sc-for list=\"{{ coverEls }}\" as=\"ce\" hint-placeholder-count=\"0\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--ui-line)\">\n            <div style=\"width:64px;height:36px;flex:none;background:var(--ui-surface,#fff);border:1px solid var(--ui-line);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden\"><img ref=\"{{ ce.thumbRef }}\" alt=\"\" style=\"max-width:100%;max-height:100%;object-fit:contain;{{ ce.thumbStyle }}\"><\u002Fdiv>\n            <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\"><span style=\"font-size:12px;color:var(--ui-ink);font-weight:600\">{{ ce.label }}<\u002Fspan><span style=\"font-size:10.5px;color:var(--ui-faint)\">{{ ce.status }}<\u002Fspan><\u002Fdiv>\n            <label class=\"icon-btn\" style=\"position:relative;padding:4px 9px;font-size:11px\">Cambiar<input type=\"file\" accept=\"image/png,image/jpeg,image/webp,image/svg+xml,.svg\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer\" sc-camel-on-change=\"{{ ce.onFile }}\"><\u002Flabel>\n            <button class=\"icon-btn\" style=\"padding:4px 9px;font-size:11px\" sc-camel-on-click=\"{{ ce.onToggle }}\">{{ ce.toggleLabel }}<\u002Fbutton>\n            <button class=\"icon-btn\" style=\"padding:4px 9px;font-size:11px\" sc-camel-on-click=\"{{ ce.onReset }}\">Original<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:flex-end\"><button class=\"icon-btn\" style=\"padding:7px 14px;background:var(--ui-strong);color:#fff;border-color:transparent\" sc-camel-on-click=\"{{ onCloseBrand }}\">Listo<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ saveAskOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;inset:0;background:rgba(8,14,19,.55);display:flex;align-items:center;justify-content:center;z-index:1100\">\n    <div style=\"background:var(--ui-surface);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:12px;padding:20px 22px;width:500px;max-width:92vw;box-shadow:0 18px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;box-sizing:border-box\">\n      <div style=\"font-size:16px;font-weight:700;color:var(--ui-ink)\">La revisión cambió<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:var(--ui-text);text-wrap:pretty\">El número de revisión pasó de <b>Rev. {{ saveAskFrom }}<\u002Fb> a <b>Rev. {{ saveAskTo }}<\u002Fb>. Puedes guardarla como un archivo nuevo en la misma carpeta (el original queda intacto) o sobrescribir el archivo original.<\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:var(--ui-muted)\">\n        Motivo del cambio (bitácora)\n        <input class=\"field-input\" style=\"font-size:13px;width:100%\" placeholder=\"Ej. Se cambió el herraje 4 por bisagra cierre lento\" value=\"{{ saveAskReason }}\" sc-camel-on-change=\"{{ onSaveAskReason }}\">\n      <\u002Flabel>\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:4px\">\n        <button class=\"icon-btn\" style=\"padding:9px 14px;font-size:12.5px;background:var(--ui-strong);color:#fff;border-color:transparent;font-weight:600;text-align:left\" sc-camel-on-click=\"{{ onSaveAskNew }}\">{{ saveAskNewLabel }}<\u002Fbutton>\n        <button class=\"icon-btn\" style=\"padding:9px 14px;font-size:12.5px;text-align:left\" sc-camel-on-click=\"{{ onSaveAskOver }}\">{{ saveAskOverLabel }}<\u002Fbutton>\n        <button class=\"icon-btn\" style=\"padding:7px 14px;font-size:12px;align-self:flex-end;border-color:transparent;background:transparent\" sc-camel-on-click=\"{{ onSaveAskCancel }}\">Cancelar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;inset:0;background:rgba(8,14,19,.55);display:flex;align-items:center;justify-content:center;z-index:1000\" sc-camel-on-mouse-down=\"{{ onCloseHelp }}\">\n    <div style=\"background:var(--ui-surface);color:var(--ui-text);border:1px solid var(--ui-line);border-radius:12px;width:820px;max-width:94vw;height:560px;max-height:88vh;box-shadow:0 18px 48px rgba(0,0,0,.35);display:flex;overflow:hidden;box-sizing:border-box\" sc-camel-on-mouse-down=\"{{ stopEvt }}\">\n      <div style=\"width:220px;flex:none;background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:18px 10px;display:flex;flex-direction:column;gap:2px;box-sizing:border-box;overflow-y:auto\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ui-faint);text-transform:uppercase;padding:0 10px 10px\">Cómo funciona<\u002Fdiv>\n        <sc-for list=\"{{ helpTopics }}\" as=\"t\" hint-placeholder-count=\"7\">\n          <button class=\"menu-item\" style=\"{{ t.style }}\" sc-camel-on-click=\"{{ t.onClick }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:24px 28px\">\n          <sc-if value=\"{{ help0 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 style=\"font-size:18px;font-weight:700;color:var(--ui-ink);margin:0\">Primeros pasos<\u002Fh3>\n              <p style=\"margin:0;font-size:13px;line-height:1.55;color:var(--ui-text);text-wrap:pretty\">El generador arma un instructivo de armado listo para imprimir: portada, hoja de datos con piezas y herrajes, y páginas de pasos.<\u002Fp>\n              <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5;color:var(--ui-text)\">\n                <li><b>Importar PowerPoint<\u002Fb> crea el instructivo a partir de una presentación con el formato habitual, o usa <b>Nuevo<\u002Fb> para empezar en blanco.<\u002Fli>\n                <li>Escribe el <b>Producto<\u002Fb> y el <b>SKU<\u002Fb> en la barra de abajo; aparecen en la portada y en los banners laterales.<\u002Fli>\n                <li>Usa el panel izquierdo para saltar entre hojas, y <b>Ctrl + rueda<\u002Fb> o los botones de abajo para hacer zoom.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ help1 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 style=\"font-size:18px;font-weight:700;color:var(--ui-ink);margin:0\">Portada y datos<\u002Fh3>\n              <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5;color:var(--ui-text)\">\n                <li>En la portada, <b>Subir imagen del mueble<\u002Fb> coloca la foto principal.<\u002Fli>\n                <li>En el recuadro <b>MUEBLE/FURNITURE<\u002Fb> las vistas se recortan solas al subirlas. Cambia su tamaño con <b>− / ＋<\u002Fb> o arrastrando la esquina azul; <b>✂<\u002Fb> vuelve a recortar los espacios blancos.<\u002Fli>\n                <li>Cualquier espacio de imagen acepta <b>Ctrl+V<\u002Fb>: copia una imagen o haz una captura de pantalla, pon el cursor sobre el espacio y pega.<\u002Fli>\n                <li>En la hoja de datos agrega piezas y herrajes con <b>+ Agregar pieza<\u002Fb>. Cada uno lleva número, nombre, cantidad e ícono.<\u002Fli>\n                <li>Los íconos se pueden subir uno por uno o importar en bloque a las <b>galerías<\u002Fb> del panel izquierdo y luego arrastrar o pegar.<\u002Fli>\n                <li><b>A− / A+<\u002Fb> en la barra del cuadro cambia la letra de toda la lista; al hacer clic en una pieza aparecen sus propios A− / A+.<\u002Fli>\n                <li>Si no caben, <b>+ Página de datos<\u002Fb> agrega otra hoja de listas.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ help2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 style=\"font-size:18px;font-weight:700;color:var(--ui-ink);margin:0\">Páginas de paso<\u002Fh3>\n              <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5;color:var(--ui-text)\">\n                <li><b>+ Página de paso<\u002Fb> agrega una hoja con hasta 3 recuadros; los pasos se numeran solos.<\u002Fli>\n                <li>Arrastra imágenes de la galería de pasos a un recuadro. Haz <b>clic derecho<\u002Fb> dentro del recuadro para agregar textos, líneas, flechas, figuras y etiquetas de pieza.<\u002Fli>\n                <li>Las piezas que se usan en cada paso se agregan en la tira inferior del recuadro con número y cantidad.<\u002Fli>\n                <li><b>Ctrl + clic<\u002Fb> selecciona varios elementos para moverlos, alinearlos o agruparlos. El botón <b>Capas<\u002Fb> del panel izquierdo ordena qué queda al frente.<\u002Fli>\n                <li>Con <b>↑ ↓<\u002Fb> y <b>Duplicar página<\u002Fb> reordenas o copias hojas completas; también puedes arrastrarlas en el panel izquierdo.<\u002Fli>\n                <li><b>↕ Mover<\u002Fb>, en la barra de cada cuadro, lo cambia de lugar dentro de la hoja o lo pasa a otra hoja (hasta 3 cuadros por hoja) junto con todo su contenido.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ help3 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 style=\"font-size:18px;font-weight:700;color:var(--ui-ink);margin:0\">Edición rápida<\u002Fh3>\n              <p style=\"margin:0;font-size:13px;line-height:1.55;color:var(--ui-text);text-wrap:pretty\">Haz clic en un elemento (imagen, figura, línea o etiqueta) para seleccionarlo; queda marcado con un borde azul.<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:max-content 1fr;gap:9px 14px;align-items:center;font-size:13px;color:var(--ui-text)\">\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Supr<\u002Fspan><span>Eliminar lo seleccionado<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Ctrl+D<\u002Fspan><span>Duplicar en el mismo recuadro<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Ctrl+C / Ctrl+X<\u002Fspan><span>Copiar / cortar<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Ctrl+V<\u002Fspan><span>Pegar elementos copiados en el último recuadro donde hiciste clic. Si copiaste una imagen o captura de pantalla, se pega en el espacio de imagen que esté bajo el cursor.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">← ↑ → ↓<\u002Fspan><span>Mover 1 px · con Shift, 10 px<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Ctrl+F<\u002Fspan><span>Buscar piezas, herrajes y textos<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Ctrl+Z / Ctrl+Y<\u002Fspan><span>Deshacer / rehacer<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Ctrl+S<\u002Fspan><span>Guardar · Ctrl+Shift+S guardar como<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">Ctrl+P<\u002Fspan><span>Revisar y generar PDF<\u002Fspan><\u002Fdiv>\n                <div style=\"display:contents\"><span style=\"font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--ui-line-strong);border-bottom-width:2px;border-radius:4px;background:var(--ui-subtle);color:var(--ui-ink);white-space:nowrap;justify-self:start\">F1<\u002Fspan><span>Abrir esta guía<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ help4 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 style=\"font-size:18px;font-weight:700;color:var(--ui-ink);margin:0\">Revisar y generar PDF<\u002Fh3>\n              <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5;color:var(--ui-text)\">\n                <li><b>Generar PDF<\u002Fb> revisa primero el instructivo. Los <b>errores<\u002Fb> (pieza que no existe, cantidades que no cuadran) van arriba; los <b>avisos<\u002Fb> (paso sin imagen) abajo.<\u002Fli>\n                <li>Haz clic en cualquier punto de la lista para ir a esa hoja y corregirlo.<\u002Fli>\n                <li>En la ventana de impresión elige <b>Guardar como PDF<\u002Fb>. El tamaño de hoja y los márgenes ya vienen configurados.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ help5 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 style=\"font-size:18px;font-weight:700;color:var(--ui-ink);margin:0\">Guardar y respaldos<\u002Fh3>\n              <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5;color:var(--ui-text)\">\n                <li><b>Guardar<\u002Fb> (Ctrl+S) crea un archivo .json con todo el instructivo, imágenes incluidas. Ábrelo después con <b>Abrir<\u002Fb>.<\u002Fli>\n                <li><b>Guardar<\u002Fb> siempre actualiza el mismo archivo. Para crear una revisión nueva, cambia el número en <b>Rev.<\u002Fb> (o usa <b>Bitácora ▸ + Nueva revisión<\u002Fb>); al guardar se te preguntará si generar un archivo nuevo en la misma carpeta, por ejemplo <i>2208-Mueble_Rev3.json<\u002Fi>, o sobrescribir el original.<\u002Fli>\n                <li>El historial de revisiones se consulta en <b>Bitácora<\u002Fb> y no se imprime.<\u002Fli>\n                <li>El <b>autoguardado<\u002Fb> respalda tu trabajo en el navegador cada 15 s; el indicador de la barra superior muestra si está al día.<\u002Fli>\n                <li>En <b>Más ▸ Versiones anteriores<\u002Fb> puedes recuperar o descargar las últimas versiones guardadas.<\u002Fli>\n                <li>Si el archivo pesa mucho, usa <b>Más ▸ Optimizar imágenes<\u002Fb>.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ help6 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 style=\"font-size:18px;font-weight:700;color:var(--ui-ink);margin:0\">Diseño y apariencia<\u002Fh3>\n              <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.5;color:var(--ui-text)\">\n                <li><b>Más ▸ Diseño, plantilla y portada<\u002Fb> carga una plantilla de PowerPoint (.pptx, .potx o .thmx) para tomar sus colores y tipografía.<\u002Fli>\n                <li>Ahí mismo puedes cambiar u ocultar el logo, las insignias de la portada y el logo del banner lateral.<\u002Fli>\n                <li>El botón <b>☾ Oscuro / ☀ Claro<\u002Fb> cambia solo la apariencia de la aplicación; las hojas y el PDF siempre se ven igual.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--ui-line)\">\n          <span style=\"font-size:12px;color:var(--ui-faint);margin-right:auto\">{{ helpPos }}<\u002Fspan>\n          <button class=\"icon-btn\" style=\"padding:7px 12px\" sc-camel-on-click=\"{{ onHelpPrev }}\">← Anterior<\u002Fbutton>\n          <button class=\"icon-btn\" style=\"padding:7px 14px;background:var(--ui-strong);color:#fff;border-color:transparent\" sc-camel-on-click=\"{{ onHelpNext }}\">{{ helpNextLabel }}<\u002Fbutton>\n          <button class=\"icon-btn\" style=\"padding:7px 12px\" sc-camel-on-click=\"{{ onCloseHelp }}\">Cerrar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--ui-ink);color:var(--ui-surface);padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;z-index:2000;box-shadow:0 10px 28px rgba(0,0,0,.3);max-width:80vw;text-align:center\">{{ toastMsg }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ ctxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;inset:0;z-index:9998\" sc-camel-on-mouse-down=\"{{ ctxClose }}\" sc-camel-on-context-menu=\"{{ ctxClose }}\"><\u002Fdiv>\n  <div class=\"no-print\" data-keep-sel=\"1\" style=\"position:fixed;left:{{ ctxX }}px;top:{{ ctxY }}px;z-index:9999;min-width:170px;background:var(--ui-surface,#fff);border:1px solid var(--ui-line-strong,#C6CBCE);border-radius:8px;box-shadow:0 6px 20px rgba(28,45,60,.18);padding:4px;display:flex;flex-direction:column;font-family:Arial\">\n    <sc-for list=\"{{ ctxItems }}\" as=\"mi\" hint-placeholder-count=\"0\">\n      <button style=\"{{ mi.style }}\" style-hover=\"background:var(--ui-sel,#E3E9EB)\" sc-camel-on-click=\"{{ mi.onClick }}\" sc-camel-on-mouse-enter=\"{{ mi.onEnter }}\"><span style=\"flex:1\">{{ mi.label }}<\u002Fspan><span style=\"font-size:9px;color:var(--ui-muted,#6D6E71)\">{{ mi.arrow }}<\u002Fspan><\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ ctxSubOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"no-print\" data-keep-sel=\"1\" style=\"position:fixed;left:{{ ctxSubX }}px;top:{{ ctxSubY }}px;z-index:10000;min-width:180px;background:var(--ui-surface,#fff);border:1px solid var(--ui-line-strong,#C6CBCE);border-radius:8px;box-shadow:0 6px 20px rgba(28,45,60,.18);padding:4px;display:flex;flex-direction:column;font-family:Arial\">\n      <sc-for list=\"{{ ctxSubItems }}\" as=\"si\" hint-placeholder-count=\"0\">\n        <button style=\"{{ si.style }}\" style-hover=\"background:var(--ui-sel,#E3E9EB)\" sc-camel-on-click=\"{{ si.onClick }}\"><span style=\"flex:1\">{{ si.label }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nlet uid = 1;\nconst nextId = () => uid++;\nconst FILE_VERSION = 2;\nconst UI_KEYS = new Set(['activePage', 'sidebarWidth', 'sidebarCollapsed', 'selectedImgId', 'activeExtraSel', 'usagePartsOpen', 'usageHardwareOpen', 'showHardwareGallery', 'showPageList', 'showPartsGallery', 'showStepsGallery', 'selectedGalleryIconId', 'selectedPartsGalleryIconId', 'usagePanelOnlyMismatch', 'showExceedPopup', 'rightPanelWidth', 'rightCollapsed']);\nconst COVER_ELS = [\n  { k: 'logo', label: 'Logo de la portada' },\n  { k: 'badge1', label: 'Insignia «Líderes en tiempo de entrega»' },\n  { k: 'badge2', label: 'Insignia «Resistencia y durabilidad»' },\n  { k: 'badge3', label: 'Insignia «Hecho en México»' },\n  { k: 'side1', label: 'Imagen lateral de portada 1' },\n  { k: 'side2', label: 'Imagen lateral de portada 2' },\n  { k: 'side3', label: 'Imagen lateral de portada 3' },\n  { k: 'side4', label: 'Imagen lateral de portada 4' },\n  { k: 'banner', label: 'Logo del banner lateral (todas las hojas)' },\n];\nconst newDocId = () => 'doc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);\nconst IDB = {\n  open() {\n    if (!this._p) this._p = new Promise((res, rej) => {\n      if (!window.indexedDB) { rej(new Error('Este navegador no permite almacenamiento local (IndexedDB).')); return; }\n      const r = indexedDB.open('generador-instructivos', 1);\n      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('autosave')) d.createObjectStore('autosave'); if (!d.objectStoreNames.contains('backups')) d.createObjectStore('backups'); };\n      r.onsuccess = () => res(r.result);\n      r.onerror = () => { this._p = null; rej(r.error); };\n    });\n    return this._p;\n  },\n  async run(store, mode, fn) {\n    const d = await this.open();\n    return new Promise((res, rej) => {\n      const t = d.transaction(store, mode); let out;\n      const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };\n      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Operación cancelada por el navegador'));\n    });\n  },\n  put(store, key, val) { return this.run(store, 'readwrite', st => st.put(val, key)); },\n  get(store, key) { return this.run(store, 'readonly', st => st.get(key)); },\n  del(store, key) { return this.run(store, 'readwrite', st => st.delete(key)); },\n  keys(store, prefix) { return this.run(store, 'readonly', st => prefix ? st.getAllKeys(IDBKeyRange.bound(prefix, prefix + '\\uffff')) : st.getAllKeys()); },\n};\nfunction canvasHasAlpha(c) {\n  try {\n    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;\n    const step = Math.max(1, Math.floor(d.length / 4 / 250000)) * 4;\n    for (let i = 3; i < d.length; i += step) if (d[i] < 250) return true;\n    re
